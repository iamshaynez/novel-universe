# 发布门禁与发布流水线：release → PR(main) 与 main 的直接推送。
# 门禁与 feat-pr-dev-release 相同，外加：
#   - PR 路径：Docker 镜像构建冒烟（GitHub runner 本地构建，不消费 secrets）；
#   - push:main / 手动路径：受限 SSH 密钥把 commit sha 传给 gb-test 上的
#     build.sh（authorized_keys 强制命令锁定；sha 只认 40 位十六进制）——
#     服务器侧完成 拉源码 → docker build → 推 ACR → deploy.sh（pull 幂等 +
#     up + 冒烟）。构建推送放服务器侧的原因：GitHub 美国 runner 推本 ACR
#     (cn-heyuan) 端点 blob 上传停滞（四连 30 分钟超时复现），服务器→ACR
#     实测秒级。主机指纹以 DEPLOY_KNOWN_HOSTS 钉死防 MITM。
#     服务器脚本版本化副本：docker/build-remote.sh 与 docker/deploy-remote.sh
#     ——改动两处同步。
# secrets 仅 4 个（DEPLOY_*）；CI 不接触 ACR 凭据（服务器侧已有 docker login）。
# 部署目标：gb-test 127.0.0.1:18090（chengdu.xiaowenz.com 由 CF 侧指向，仓库不管域名）。
name: pr-main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 单测 + 编译 + lint + API + e2e 全量
        run: npm test
      - name: 剧透纪元 + 图 + 结局全可达
        run: npm run verify
      - name: 迁移落地并幂等
        run: |
          npm run migrate
          npm run migrate:status

  # PR 只做构建冒烟：本地 tag，不登录、不推送、不消费 secrets
  docker:
    runs-on: ubuntu-latest
    needs: gates
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: 镜像构建冒烟（启动即迁移+编译，构建通过即部署入口可用）
        run: docker build -t novel-universe:ci .

  # main 推送 / 手动触发：sha 交给服务器侧构建推送并部署（见文件头注释）
  deploy:
    runs-on: ubuntu-latest
    needs: gates
    if: github.event_name != 'pull_request'
    # 部署不可并发：排队不取消，避免两轮 build/up 互相踩（仅约束本 job，不影响 PR 门禁）
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: 服务器侧构建推送并部署冒烟（受限密钥 + sha → build.sh）
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_* secrets 未配置（见 docker/服务器初始化.md）"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # 密钥在服务器侧被强制命令接管：远程命令即目标 sha（build.sh 经
          # $SSH_ORIGINAL_COMMAND 读取并校验 40 位十六进制，其余一律拒绝）
          ssh -F /dev/null -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
