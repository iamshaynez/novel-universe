# gb-test 服务器 /opt/apps/novel-universe/docker-compose.yml 的版本化副本——改动两处同步。
# 服务器布局：/opt/apps/novel-universe/{docker-compose.yml, build.sh, deploy.sh, .env, data/}
# 镜像来自阿里云 ACR（与 app41 同实例，命名空间 xiaowenz）。
# 接入层：openresty 反代 chengdu.xiaowenz.com → 容器名 novel-universe:3000，
# 经共享 apps 网络（本文件底部 networks 段完成接入）；CF 当前 Flexible（回源 80），
# 源站 443 块与 le.crt SAN 已备好，随时可切 Full(strict)。
# 本机 18090 端口保留作运维/冒烟后门（deploy.sh 冒烟即打它）。
services:
  novel:
    image: ${ACR_REGISTRY}/xiaowenz/novel-universe:main
    container_name: novel-universe
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18090:3000"   # 只绑回环：对外一律走 openresty/CF，不直接暴露公网
    environment:
      PORT: "3000"
      DB_PATH: /data/novel.db
    volumes:
      - ./data:/data
    healthcheck:
      # 启动即「迁移+全游戏编译+图校验，失败拒绝启动」——/ 能应答即等价健康
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# 接入层：与 openresty（1Panel）共享 apps 网络，nginx 以容器名反代
networks:
  default:
    name: apps
    external: true
