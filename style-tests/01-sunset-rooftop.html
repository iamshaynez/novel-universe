<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>测试01 · 黄昏天台 — 剪影+氛围路线</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0a14;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 28px 16px 48px;
  }
  h1 { color: #e8d9f0; font-size: 18px; font-weight: 600; letter-spacing: .08em; margin-bottom: 6px; }
  .note { color: #8a7a9c; font-size: 13px; margin-bottom: 18px; }
  .frame {
    width: min(1100px, 100%); aspect-ratio: 16 / 9;
    border-radius: 14px; overflow: hidden; position: relative;
    box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
    background: #2b1a4a;
  }
  svg { width: 100%; height: 100%; display: block; }

  .mote { animation: twinkle 3.2s ease-in-out infinite alternate; }
  .mote:nth-of-type(2) { animation-delay: .6s; }
  .mote:nth-of-type(3) { animation-delay: 1.2s; }
  .mote:nth-of-type(4) { animation-delay: 1.8s; }
  .mote:nth-of-type(5) { animation-delay: .3s; }
  .mote:nth-of-type(6) { animation-delay: .9s; }
  .mote:nth-of-type(7) { animation-delay: 2.1s; }
  .mote:nth-of-type(8) { animation-delay: 1.5s; }
  @keyframes twinkle {
    from { opacity: .15; transform: translateY(0); }
    to   { opacity: .95; transform: translateY(-14px); }
  }
  .dialog-text { animation: none; }
</style>
</head>
<body>
<h1>测试 01 · 黄昏天台 —— 剪影 + 氛围路线（青春/恋爱向）</h1>
<p class="note">看点：人物完全不画脸，靠轮廓 + 逆光 + 构图 + 粒子演出传递情绪；规避恐怖谷。</p>

<div class="frame">
<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#3b2560"/>
      <stop offset="0.38" stop-color="#93407a"/>
      <stop offset="0.66" stop-color="#e2795a"/>
      <stop offset="1"    stop-color="#ffd9a3"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#fff6dc" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffd9a0" stop-opacity="0.5"/>
      <stop offset="1"    stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="girlGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffb076" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#ffb076" stop-opacity="0.15"/>
      <stop offset="1"   stop-color="#ffb076" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33204e"/>
      <stop offset="1" stop-color="#120a20"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"   stop-color="#0a0518" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="mesh" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#221338" stroke-width="1.4"/>
      <line x1="0" y1="0" x2="26" y2="0" stroke="#221338" stroke-width="1.4"/>
    </pattern>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="1280" height="548" fill="url(#sky)"/>
  <circle cx="985" cy="435" r="185" fill="url(#sunGlow)"/>
  <circle cx="985" cy="435" r="46" fill="#fff3d2"/>

  <!-- 晚霞层云 -->
  <g>
    <ellipse cx="250"  cy="312" rx="132" ry="14" fill="#ffb08e" opacity="0.5"/>
    <ellipse cx="300"  cy="298" rx="80"  ry="10" fill="#ffd3ae" opacity="0.55"/>
    <ellipse cx="470"  cy="352" rx="92"  ry="10" fill="#ff9877" opacity="0.4"/>
    <ellipse cx="760"  cy="262" rx="112" ry="12" fill="#ff9877" opacity="0.45"/>
    <ellipse cx="820"  cy="248" rx="60"  ry="8"  fill="#ffc4a0" opacity="0.5"/>
    <ellipse cx="1060" cy="330" rx="140" ry="13" fill="#ffbe97" opacity="0.5"/>
    <ellipse cx="1150" cy="310" rx="70"  ry="9"  fill="#ffd9b6" opacity="0.45"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#3b2456" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M300 252 q8 -7 16 0 q8 -7 16 0"/>
    <path d="M372 224 q6 -5 12 0 q6 -5 12 0" stroke-width="2.4"/>
    <path d="M340 276 q5 -4 10 0 q5 -4 10 0" stroke-width="2"/>
  </g>

  <!-- 远景城市 -->
  <path d="M0 548 L0 486 L58 486 L58 502 L104 502 L104 470 L150 470 L150 500 L210 500 L210 462 L262 462
           L262 496 L330 496 L330 474 L392 474 L392 502 L470 502 L470 480 L560 480 L560 500 L660 500
           L660 472 L740 472 L740 498 L820 498 L820 478 L900 478 L900 502 L980 502 L980 470 L1050 470
           L1050 498 L1130 498 L1130 474 L1200 474 L1200 500 L1280 500 L1280 548 Z"
        fill="#6a4488" opacity="0.75"/>
  <!-- 近景城市（中部留白给落日） -->
  <g fill="#3a2456">
    <path d="M0 548 L0 430 L64 430 L64 412 L92 412 L92 430 L120 430 L120 468 L188 468 L188 440 L262 440 L262 486 L330 486 L330 462 L392 462 L392 496 L1280 496 L1280 548 Z"/>
    <path d="M936 548 L936 448 L1002 448 L1002 470 L1080 470 L1080 442 L1160 442 L1160 474 L1280 474 L1280 548 Z"/>
    <line x1="70" y1="412" x2="70" y2="386" stroke="#3a2456" stroke-width="4"/>
    <line x1="1118" y1="442" x2="1118" y2="410" stroke="#3a2456" stroke-width="4"/>
  </g>
  <!-- 零星亮窗 -->
  <g fill="#ffcf96" opacity="0.55">
    <rect x="20"  y="452" width="7" height="9"/><rect x="40"  y="478" width="7" height="9"/>
    <rect x="140" y="480" width="7" height="9"/><rect x="204" y="454" width="7" height="9"/>
    <rect x="300" y="474" width="7" height="9"/><rect x="960" y="466" width="7" height="9"/>
    <rect x="1030" y="484" width="7" height="9"/><rect x="1120" y="458" width="7" height="9"/>
    <rect x="1200" y="486" width="7" height="9"/><rect x="1250" y="470" width="7" height="9"/>
  </g>

  <!-- 少女背后的逆光分离层 -->
  <circle cx="690" cy="350" r="215" fill="url(#girlGlow)"/>

  <!-- 少女剪影（双马尾 + 水手服，站在铁丝网后） -->
  <g>
    <path d="M664 240 C 648 268, 642 330, 652 382 C 655 396, 668 396, 671 382 C 678 332, 678 276, 678 246 Z" fill="#1c1130"/>
    <path d="M716 240 C 734 266, 742 326, 734 374 C 731 390, 718 390, 715 376 C 708 328, 706 274, 702 246 Z" fill="#1c1130"/>
    <circle cx="690" cy="248" r="35" fill="#1c1130"/>
    <path d="M676 280 Q690 272 704 280 L714 330 Q690 340 666 330 Z" fill="#1c1130"/>
    <path d="M666 328 Q690 336 714 328 L740 462 Q714 472 690 466 Q666 472 640 462 Z" fill="#1c1130"/>
    <rect x="678" y="460" width="11" height="62" rx="5" fill="#1c1130"/>
    <rect x="701" y="460" width="11" height="62" rx="5" fill="#1c1130"/>
    <rect x="672" y="518" width="20" height="11" rx="4" fill="#1c1130"/>
    <rect x="700" y="518" width="20" height="11" rx="4" fill="#1c1130"/>
    <path d="M678 284 Q660 316 662 350" stroke="#1c1130" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M702 284 Q730 296 728 268 Q726 256 716 250" stroke="#1c1130" stroke-width="13" fill="none" stroke-linecap="round"/>
    <!-- 右侧轮廓的暖色轮廓光（朝阳面勾边） -->
    <g stroke="#ffc98f" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75">
      <path d="M716 244 C 732 268, 738 322, 732 368"/>
      <path d="M714 330 Q690 340 666 330" transform="translate(46,132) scale(0.52)" opacity="0"/>
      <path d="M716 330 L738 458"/>
      <path d="M706 250 Q726 262 724 284"/>
    </g>
  </g>

  <!-- 铁丝网（前景，制造纵深） -->
  <rect x="0" y="352" width="1280" height="193" fill="url(#mesh)" opacity="0.5"/>
  <g fill="#1a0f2e">
    <rect x="0"   y="352" width="1280" height="6"/>
    <rect x="0"   y="428" width="1280" height="6"/>
    <rect x="0"   y="500" width="1280" height="7"/>
    <rect x="20"  y="348" width="7" height="197"/><rect x="180" y="348" width="7" height="197"/>
    <rect x="340" y="348" width="7" height="197"/><rect x="500" y="348" width="7" height="197"/>
    <rect x="660" y="348" width="7" height="197"/><rect x="820" y="348" width="7" height="197"/>
    <rect x="980" y="348" width="7" height="197"/><rect x="1140" y="348" width="7" height="197"/>
    <rect x="1268" y="348" width="7" height="197"/>
  </g>

  <!-- 天台地面（最前景） -->
  <rect x="0" y="545" width="1280" height="175" fill="url(#floorG)"/>
  <line x1="0" y1="545" x2="1280" y2="545" stroke="#ffb076" stroke-width="1.5" opacity="0.3"/>
  <!-- 天台设备剪影 -->
  <g>
    <rect x="60" y="430" width="150" height="115" fill="#190e2c"/>
    <line x1="60" y1="430" x2="210" y2="430" stroke="#3a2456" stroke-width="2" opacity="0.8"/>
    <circle cx="135" cy="470" r="26" fill="#140c24" stroke="#2b1a44" stroke-width="3"/>
    <path d="M135 470 L135 450 M135 470 L152 480 M135 470 L118 480" stroke="#2b1a44" stroke-width="4"/>
    <rect x="232" y="412" width="14" height="133" fill="#170c28"/>
    <rect x="254" y="434" width="10" height="111" fill="#170c28"/>
  </g>

  <!-- 漂浮光尘 -->
  <g fill="#ffdcae">
    <circle class="mote" cx="300"  cy="200" r="3"/>
    <circle class="mote" cx="420"  cy="152" r="2"/>
    <circle class="mote" cx="560"  cy="120" r="2"/>
    <circle class="mote" cx="820"  cy="122" r="2.5"/>
    <circle class="mote" cx="900"  cy="182" r="2"/>
    <circle class="mote" cx="1052" cy="260" r="2.4"/>
    <circle class="mote" cx="1150" cy="150" r="2"/>
    <circle class="mote" cx="204"  cy="332" r="2.5"/>
  </g>

  <!-- 对话框 -->
  <g font-family="'Songti SC','Noto Serif SC',serif">
    <rect x="70" y="584" width="1140" height="112" rx="14" fill="#120a22" opacity="0.88"
          stroke="#ffb37a" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="100" y="566" width="92" height="34" rx="8" fill="#ff9e6b"/>
    <text x="146" y="589" text-anchor="middle" font-size="19" fill="#2a1230" font-weight="700">少女</text>
    <text class="dialog-text" x="110" y="644" font-size="25" fill="#ffeede" letter-spacing="1">「今天的风，好像有点温柔呢。」</text>
  </g>

  <rect x="0" y="0" width="1280" height="720" fill="url(#vig)" pointer-events="none"/>
</svg>
</div>
</body>
</html>
