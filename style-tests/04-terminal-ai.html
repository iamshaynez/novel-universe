<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>测试04 · 终端与AI — 科幻/虚拟世界路线</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #04080c;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 28px 16px 48px;
  }
  h1 { color: #bff2ec; font-size: 18px; font-weight: 600; letter-spacing: .08em; margin-bottom: 6px; }
  .note { color: #5f8a84; font-size: 13px; margin-bottom: 18px; }
  .screen {
    width: min(1100px, 100%); aspect-ratio: 16 / 9;
    border-radius: 14px; overflow: hidden; position: relative;
    box-shadow: 0 24px 80px rgba(0,0,0,.75), 0 0 40px rgba(110,243,224,.08), 0 0 0 1px rgba(110,243,224,.18);
    background: #04121a;
    display: flex; flex-direction: column;
    font-family: "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  }
  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px; font-size: 13px; color: #6ef3e0;
    border-bottom: 1px solid rgba(110,243,224,.22);
    background: rgba(110,243,224,.04); letter-spacing: .08em;
    flex: none;
  }
  .main { flex: 1; display: flex; min-height: 0; }
  .chat {
    width: 42%; padding: 18px 16px; display: flex; flex-direction: column;
    gap: 12px; justify-content: flex-end; overflow: hidden;
    border-right: 1px solid rgba(110,243,224,.15);
  }
  .row { font-size: 14.5px; line-height: 1.55; max-width: 95%; }
  .row .who { color: #4e8f86; font-size: 11.5px; letter-spacing: .15em; margin-bottom: 2px; }
  .row.her .msg {
    color: #d8fff7; background: rgba(110,243,224,.08);
    border: 1px solid rgba(110,243,224,.25); border-radius: 2px 12px 12px 12px;
    padding: 8px 12px; text-shadow: 0 0 8px rgba(110,243,224,.35);
  }
  .row.me { align-self: flex-end; text-align: right; }
  .row.me .msg { color: #a8c6c0; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12); border-radius: 12px 2px 12px 12px; padding: 8px 12px; }
  .row.sys { color: #3f6f68; font-size: 12px; letter-spacing: .1em; }
  .typing { color: #6ef3e0; font-size: 13px; }
  .caret { display: inline-block; width: 8px; height: 15px; background: #6ef3e0; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .stage { flex: 1; position: relative; }
  .stage svg { width: 100%; height: 100%; display: block; }

  .inputbar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-top: 1px solid rgba(110,243,224,.22);
    background: rgba(110,243,224,.04); color: #6ef3e0; font-size: 14px;
  }
  .inputbar .prompt { color: #3f6f68; }

  .scan {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0 2px, transparent 2px 4px);
    mix-blend-mode: multiply;
  }
  .vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,10,14,.55) 100%); }
  .flick { position: absolute; inset: 0; pointer-events: none; background: #9df3e4; opacity: 0; animation: flick 7s infinite steps(1); }
  @keyframes flick { 0%,96.5%,100% {opacity:0;} 97% {opacity:.03;} 97.4% {opacity:0;} 98% {opacity:.05;} 98.3% {opacity:0;} }

  .avatar { animation: floaty 6s ease-in-out infinite alternate; }
  @keyframes floaty { from { transform: translateY(-6px); } to { transform: translateY(10px); } }
  .ring { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .eye { transform-box: fill-box; transform-origin: center; animation: eyeblink 5s infinite; }
  @keyframes eyeblink { 0%,44%,48%,100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } }
  .shard { animation: shard 4s ease-in-out infinite alternate; }
  .shard:nth-of-type(2) { animation-delay: .8s; } .shard:nth-of-type(3) { animation-delay: 1.6s; }
  .shard:nth-of-type(4) { animation-delay: 2.4s; } .shard:nth-of-type(5) { animation-delay: .4s; }
  .shard:nth-of-type(6) { animation-delay: 2s; }
  @keyframes shard { from { opacity: .15; } to { opacity: .85; } }
</style>
</head>
<body>
<h1>测试 04 · 终端与 AI —— 科幻 / 虚拟世界路线</h1>
<p class="note">看点：界面即美术 —— 终端 UI + 几何晶体「AI 少女」+ CRT 扫描线；完全不需要写实画功。</p>

<div class="screen">
  <div class="statusbar">
    <span>LINK://深夜频道 — 23:47 · 通道加密 256bit</span>
    <span>SIG ▮▮▮▮▯ 92%</span>
  </div>

  <div class="main">
    <div class="chat">
      <div class="row sys">[系统] 节点握手完成 · 延迟 47ms</div>
      <div class="row sys">[档案] she.exe · 大小未知 · 签名缺失</div>
      <div class="row her"><div class="who">她</div><div class="msg">你终于连上来了。</div></div>
      <div class="row her"><div class="who">她</div><div class="msg">这个房间，今晚也只有我们两个呢。</div></div>
      <div class="row me"><div class="who">你</div><div class="msg">……你是谁？</div></div>
      <div class="row her"><div class="who">她</div><div class="msg">猜猜看？提示：我一直住在这里。<span class="caret"></span></div></div>
    </div>

    <div class="stage">
      <svg viewBox="0 0 700 560" preserveAspectRatio="xMidYMid slice">
        <defs>
          <radialGradient id="aiglow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#6ef3e0" stop-opacity="0.22"/>
            <stop offset="1" stop-color="#6ef3e0" stop-opacity="0"/>
          </radialGradient>
          <filter id="glowF" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="3.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- 数据立柱 -->
        <g fill="rgba(110,243,224,.05)">
          <rect x="60"  y="0" width="44" height="560"/>
          <rect x="150" y="0" width="26" height="560"/>
          <rect x="540" y="0" width="52" height="560"/>
          <rect x="640" y="0" width="30" height="560"/>
        </g>

        <!-- 网格地面 -->
        <g stroke="rgba(110,243,224,.18)" stroke-width="1.2">
          <line x1="0" y1="386" x2="700" y2="386"/>
          <line x1="0" y1="404" x2="700" y2="404"/>
          <line x1="0" y1="428" x2="700" y2="428"/>
          <line x1="0" y1="458" x2="700" y2="458"/>
          <line x1="0" y1="496" x2="700" y2="496"/>
          <line x1="0" y1="542" x2="700" y2="542"/>
          <line x1="350" y1="386" x2="-140" y2="560"/>
          <line x1="350" y1="386" x2="90"  y2="560"/>
          <line x1="350" y1="386" x2="240" y2="560"/>
          <line x1="350" y1="386" x2="350" y2="560"/>
          <line x1="350" y1="386" x2="460" y2="560"/>
          <line x1="350" y1="386" x2="610" y2="560"/>
          <line x1="350" y1="386" x2="840" y2="560"/>
        </g>

        <!-- 悬浮碎片 -->
        <g class="shards" fill="rgba(110,243,224,.10)" stroke="#6ef3e0" stroke-width="1.6">
          <polygon class="shard" points="120,140 134,158 112,166"/>
          <polygon class="shard" points="580,110 598,118 588,136"/>
          <polygon class="shard" points="620,320 636,306 640,326"/>
          <polygon class="shard" points="90,300 104,310 96,326"/>
          <polygon class="shard" points="520,430 538,424 534,444"/>
          <polygon class="shard" points="170,420 182,408 190,424"/>
        </g>

        <!-- AI 少女（几何晶体构成） -->
        <g class="avatar" filter="url(#glowF)">
          <circle cx="350" cy="250" r="160" fill="url(#aiglow)"/>
          <ellipse class="ring" cx="350" cy="262" rx="128" ry="36" fill="none"
                   stroke="rgba(160,255,240,.5)" stroke-width="1.6" stroke-dasharray="10 14"/>
          <!-- 长发（背层，垂到裙摆） -->
          <polygon points="350,126 312,244 306,336 394,336 388,244"
                   fill="rgba(110,243,224,.10)" stroke="#6ef3e0" stroke-width="2"/>
          <!-- 发冠 -->
          <polygon points="350,120 316,172 384,172"
                   fill="rgba(110,243,224,.14)" stroke="#6ef3e0" stroke-width="2"/>
          <!-- 侧发（左右两束晶簇） -->
          <polygon points="322,170 330,176 302,262 290,254" fill="rgba(110,243,224,.12)" stroke="#6ef3e0" stroke-width="2"/>
          <polygon points="378,170 370,176 398,262 410,254" fill="rgba(110,243,224,.12)" stroke="#6ef3e0" stroke-width="2"/>
          <!-- 头（六边形） -->
          <polygon points="350,150 378,166 378,196 350,212 322,196 322,166"
                   fill="rgba(110,243,224,.08)" stroke="#6ef3e0" stroke-width="2.4"/>
          <!-- 眼（菱形，会眨） -->
          <path class="eye" d="M340 178 l7 9 -7 9 -7 -9 Z" fill="#eafffb"/>
          <path class="eye" d="M360 178 l7 9 -7 9 -7 -9 Z" fill="#eafffb"/>
          <!-- 身体（多面棱柱裙） -->
          <polygon points="350,212 316,238 300,332 350,352 400,332 384,238"
                   fill="rgba(110,243,224,.08)" stroke="#6ef3e0" stroke-width="2.4"/>
          <g stroke="rgba(110,243,224,.4)" stroke-width="1.3">
            <line x1="350" y1="212" x2="350" y2="352"/>
            <line x1="332" y1="252" x2="338" y2="328"/>
            <line x1="368" y1="252" x2="362" y2="328"/>
          </g>
          <!-- 心核 -->
          <polygon points="350,282 358,294 350,306 342,294" fill="#ff7da8" opacity=".9"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="inputbar">
    <span class="prompt">&gt;</span>
    <span>输入讯息…</span>
    <span class="caret" style="margin-left:2px"></span>
  </div>

  <div class="scan"></div>
  <div class="vig"></div>
  <div class="flick"></div>
</div>
</body>
</html>
