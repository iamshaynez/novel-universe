<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>测试03 · 立绘表情差分 — 扁平符号化路线</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #100b16;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 28px 16px 48px;
  }
  h1 { color: #f0e2f0; font-size: 18px; font-weight: 600; letter-spacing: .08em; margin-bottom: 6px; }
  .note { color: #94819f; font-size: 13px; margin-bottom: 18px; }
  .sheet {
    width: min(980px, 100%);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
    background: #f7eef4;
  }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<h1>测试 03 · 立绘表情差分 —— 扁平符号化路线（最激进的人脸实验）</h1>
<p class="note">看点：四个表情共用同一套身体/发型组件，只换眉眼嘴 —— 验证「组件化 = 角色一致性」这个核心卖点。</p>

<div class="sheet">
<svg viewBox="0 0 900 1120" font-family="'PingFang SC','Hiragino Sans GB',sans-serif">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9d6"/><stop offset="1" stop-color="#ffd2c4"/></linearGradient>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff6ee"/><stop offset="1" stop-color="#c2ecf2"/></linearGradient>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0ff"/><stop offset="1" stop-color="#dbe2ff"/></linearGradient>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3ea"/><stop offset="1" stop-color="#ffd3dd"/></linearGradient>

    <!-- ====== 角色基础组件（同一份，四个表情复用） ====== -->
    <g id="chBase">
      <!-- 后发 -->
      <path d="M220 40 C 122 40, 92 152, 96 252 C 98 332, 128 402, 150 432 L290 432
               C 312 402, 342 332, 344 252 C 348 152, 318 40, 220 40 Z"
            fill="#e88aa4" stroke="#46324e" stroke-width="3"/>
      <!-- 脖子 -->
      <rect x="202" y="298" width="36" height="44" rx="10" fill="#ffdcc7"/>
      <!-- 身体：水手服 -->
      <path d="M118 540 L118 402 Q150 344 220 338 Q290 344 322 402 L322 540 Z"
            fill="#fbfbfd" stroke="#46324e" stroke-width="3"/>
      <path d="M170 344 L220 376 L270 344 L284 354 L220 396 L156 354 Z"
            fill="#2f3e68" stroke="#46324e" stroke-width="3" stroke-linejoin="round"/>
      <path d="M220 380 L206 366 L188 374 L202 388 Z M220 380 L234 366 L252 374 L238 388 Z"
            fill="#e0586e" stroke="#46324e" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="220" cy="382" r="7" fill="#c94459" stroke="#46324e" stroke-width="2.5"/>
      <!-- 脸 -->
      <path d="M220 92 C 152 92, 128 150, 132 216 C 135 270, 170 322, 220 322
               C 270 322, 305 270, 308 216 C 312 150, 288 92, 220 92 Z"
            fill="#ffe7d6" stroke="#46324e" stroke-width="3"/>
      <!-- 耳朵 -->
      <circle cx="131" cy="230" r="10" fill="#ffe7d6" stroke="#46324e" stroke-width="3"/>
      <circle cx="309" cy="230" r="10" fill="#ffe7d6" stroke="#46324e" stroke-width="3"/>
      <!-- 前发（齐刘海） -->
      <path d="M220 58 C 150 58, 128 110, 132 164
               Q148 152, 156 172 Q170 130, 186 172 Q202 128, 220 168 Q238 128, 254 172 Q270 130, 284 172
               Q292 152, 308 164 C 312 110, 290 58, 220 58 Z"
            fill="#f7a8bd" stroke="#46324e" stroke-width="3" stroke-linejoin="round"/>
      <!-- 侧发 -->
      <path d="M132 160 C 120 200, 118 260, 126 310 Q136 300, 142 268 Q136 210, 142 168 Z"
            fill="#f7a8bd" stroke="#46324e" stroke-width="3"/>
      <path d="M308 160 C 320 200, 322 260, 314 310 Q304 300, 298 268 Q304 210, 298 168 Z"
            fill="#f7a8bd" stroke="#46324e" stroke-width="3"/>
      <!-- 头顶呆毛 -->
      <path d="M220 58 Q216 34, 238 26 Q226 40, 232 58" fill="#f7a8bd" stroke="#46324e" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- ===== 面板 1：通常 ===== -->
  <g transform="translate(10,10)">
    <rect width="440" height="540" fill="url(#bgA)" rx="16"/>
    <g fill="#ffffff" opacity=".4">
      <circle cx="70" cy="90" r="26"/><circle cx="380" cy="140" r="34"/><circle cx="330" cy="60" r="14"/>
      <circle cx="50" cy="420" r="30"/><circle cx="400" cy="460" r="22"/>
    </g>
    <use href="#chBase"/>
    <g>
      <ellipse cx="150" cy="270" rx="19" ry="10" fill="#ff9d9d" opacity=".4"/>
      <ellipse cx="290" cy="270" rx="19" ry="10" fill="#ff9d9d" opacity=".4"/>
      <ellipse cx="170" cy="236" rx="25" ry="29" fill="#fff" stroke="#46324e" stroke-width="3"/>
      <ellipse cx="270" cy="236" rx="25" ry="29" fill="#fff" stroke="#46324e" stroke-width="3"/>
      <circle cx="170" cy="240" r="16" fill="#35426b"/>
      <circle cx="270" cy="240" r="16" fill="#35426b"/>
      <circle cx="170" cy="243" r="8" fill="#1e2745"/>
      <circle cx="270" cy="243" r="8" fill="#1e2745"/>
      <circle cx="163" cy="231" r="5" fill="#fff"/>
      <circle cx="263" cy="231" r="5" fill="#fff"/>
      <path d="M145 224 Q170 209 195 224" stroke="#46324e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M245 224 Q270 209 295 224" stroke="#46324e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M148 196 Q170 187 192 196" stroke="#5a4660" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M248 196 Q270 187 292 196" stroke="#5a4660" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M209 290 Q220 296 231 290" stroke="#c25b70" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </g>
    <text x="220" y="522" text-anchor="middle" font-size="24" fill="#46324e" font-weight="700" letter-spacing="4">通常</text>
  </g>

  <!-- ===== 面板 2：微笑 ===== -->
  <g transform="translate(450,10)">
    <rect width="440" height="540" fill="url(#bgB)" rx="16"/>
    <g fill="#ffffff" opacity=".45">
      <circle cx="80" cy="120" r="22"/><circle cx="370" cy="80" r="30"/><circle cx="60" cy="400" r="26"/>
      <circle cx="390" cy="430" r="34"/><circle cx="230" cy="60" r="12"/>
    </g>
    <use href="#chBase"/>
    <g>
      <ellipse cx="150" cy="270" rx="21" ry="11" fill="#ff9d9d" opacity=".6"/>
      <ellipse cx="290" cy="270" rx="21" ry="11" fill="#ff9d9d" opacity=".6"/>
      <path d="M145 236 Q170 214 195 236" stroke="#46324e" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M245 236 Q270 214 295 236" stroke="#46324e" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M144 192 Q170 182 196 192" stroke="#5a4660" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M244 192 Q270 182 296 192" stroke="#5a4660" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M206 284 C 212 300, 228 300, 234 284 C 226 290, 214 290, 206 284 Z"
            fill="#a84a62" stroke="#46324e" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M118 210 l5 10 10 5 -10 5 -5 10 -5 -10 -10 -5 10 -5 Z" fill="#ffd76e" stroke="#d9a83e" stroke-width="1.5"/>
      <path d="M326 236 l4 8 8 4 -8 4 -4 8 -4 -8 -8 -4 8 -4 Z" fill="#ffd76e" stroke="#d9a83e" stroke-width="1.5"/>
    </g>
    <text x="220" y="522" text-anchor="middle" font-size="24" fill="#46324e" font-weight="700" letter-spacing="4">微笑</text>
  </g>

  <!-- ===== 面板 3：惊讶 ===== -->
  <g transform="translate(10,560)">
    <rect width="440" height="540" fill="url(#bgC)" rx="16"/>
    <g fill="#ffffff" opacity=".45">
      <circle cx="90" cy="80" r="24"/><circle cx="360" cy="110" r="30"/><circle cx="70" cy="440" r="28"/>
      <circle cx="380" cy="470" r="20"/><circle cx="200" cy="70" r="12"/>
    </g>
    <use href="#chBase"/>
    <g>
      <ellipse cx="170" cy="238" rx="27" ry="33" fill="#fff" stroke="#46324e" stroke-width="3"/>
      <ellipse cx="270" cy="238" rx="27" ry="33" fill="#fff" stroke="#46324e" stroke-width="3"/>
      <circle cx="170" cy="242" r="11" fill="#35426b"/>
      <circle cx="270" cy="242" r="11" fill="#35426b"/>
      <circle cx="165" cy="236" r="4.5" fill="#fff"/>
      <circle cx="265" cy="236" r="4.5" fill="#fff"/>
      <path d="M143 222 Q170 208 197 222" stroke="#46324e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M243 222 Q270 208 297 222" stroke="#46324e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M144 184 Q170 173 196 184" stroke="#5a4660" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M244 184 Q270 173 296 184" stroke="#5a4660" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="220" cy="294" rx="9" ry="12" fill="#a84a62" stroke="#46324e" stroke-width="2.5"/>
      <!-- 汗滴 -->
      <path d="M338 170 q11 15 0 24 q-11 -9 0 -24 Z" fill="#a8dcff" stroke="#6fb4de" stroke-width="2"/>
      <!-- 头顶冲击线 -->
      <g stroke="#46324e" stroke-width="4" stroke-linecap="round">
        <line x1="180" y1="52" x2="168" y2="28"/><line x1="216" y1="44" x2="212" y2="18"/>
        <line x1="252" y1="54" x2="262" y2="30"/>
      </g>
      <ellipse cx="150" cy="272" rx="18" ry="9" fill="#ff9d9d" opacity=".35"/>
      <ellipse cx="290" cy="272" rx="18" ry="9" fill="#ff9d9d" opacity=".35"/>
    </g>
    <text x="220" y="522" text-anchor="middle" font-size="24" fill="#46324e" font-weight="700" letter-spacing="4">惊讶</text>
  </g>

  <!-- ===== 面板 4：生气 ===== -->
  <g transform="translate(450,560)">
    <rect width="440" height="540" fill="url(#bgD)" rx="16"/>
    <g fill="#ffffff" opacity=".45">
      <circle cx="76" cy="110" r="26"/><circle cx="376" cy="70" r="30"/><circle cx="56" cy="430" r="24"/>
      <circle cx="392" cy="450" r="32"/><circle cx="240" cy="64" r="12"/>
    </g>
    <use href="#chBase"/>
    <g>
      <ellipse cx="170" cy="240" rx="25" ry="30" fill="#fff" stroke="#46324e" stroke-width="3"/>
      <ellipse cx="270" cy="240" rx="25" ry="30" fill="#fff" stroke="#46324e" stroke-width="3"/>
      <!-- 半阖上眼睑 -->
      <path d="M143 224 Q170 240 197 224 L197 206 L143 206 Z" fill="#ffe7d6"/>
      <path d="M243 224 Q270 240 297 224 L297 206 L243 206 Z" fill="#ffe7d6"/>
      <circle cx="170" cy="244" r="14" fill="#35426b"/>
      <circle cx="270" cy="244" r="14" fill="#35426b"/>
      <circle cx="164" cy="238" r="4.5" fill="#fff"/>
      <circle cx="264" cy="238" r="4.5" fill="#fff"/>
      <path d="M146 200 L194 220" stroke="#5a4660" stroke-width="6" stroke-linecap="round"/>
      <path d="M294 200 L246 220" stroke="#5a4660" stroke-width="6" stroke-linecap="round"/>
      <path d="M206 294 Q212 287 219 294 Q226 301 233 294" stroke="#c25b70" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <!-- 青筋十字 -->
      <g stroke="#e04848" stroke-width="4.5" stroke-linecap="round" transform="rotate(18 332 128)">
        <line x1="324" y1="114" x2="332" y2="122"/><line x1="340" y1="114" x2="332" y2="122"/>
        <line x1="324" y1="134" x2="332" y2="126"/><line x1="340" y1="134" x2="332" y2="126"/>
      </g>
      <!-- 鼓起的脸颊 -->
      <path d="M172 266 Q182 280 172 292" stroke="#e8919e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M268 266 Q258 280 268 292" stroke="#e8919e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="150" cy="272" rx="20" ry="11" fill="#ff8f9c" opacity=".55"/>
      <ellipse cx="290" cy="272" rx="20" ry="11" fill="#ff8f9c" opacity=".55"/>
    </g>
    <text x="220" y="522" text-anchor="middle" font-size="24" fill="#46324e" font-weight="700" letter-spacing="4">生气</text>
  </g>

  <text x="450" y="1112" text-anchor="middle" font-size="20" fill="#8a7386" letter-spacing="2">同一份身体/发型组件 · 只换眉、眼、嘴 —— 角色一致性由代码保证</text>
</svg>
</div>
</body>
</html>
