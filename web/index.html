<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>锦江悬疑宇宙 · 文字舞台</title>
<style>
  /* 文字舞台播放器 —— 排版即运镜。
     案卷画风：深夜档案室，灯下一册摊开的卷宗。正文住纸上，演出词汇（印章/声纹/时间轴）皆为卷宗批注。
     调色板与 universe/tokens.json 的 stage 令牌对齐(单一事实源,改一处同步一处)。 */
  :root{
    --bg:#17130d; --ink:#e6dabb; --ink-dim:#8f8567;
    --paper:#e4d6b3; --paper-ink:#332e21;
    --accent:#c9a15f; --accent-cold:#4e7d87; --blood:#9e3a2b;
    --serif:"Songti SC","Noto Serif SC","Noto Serif CJK SC",serif;
    --kai:"Kaiti SC","STKaiti","KaiTi","Songti SC","Noto Serif SC",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden}
  #stage{position:relative;height:100vh;overflow:hidden;user-select:none}
  /* 档案室空气:全屏纸纹颗粒 + 暗角 */
  #stage::before{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;
    opacity:.07;mix-blend-mode:soft-light;
    background:repeating-linear-gradient(93deg,transparent 0 3px,#fff 3px 4px,transparent 4px 11px),
               repeating-linear-gradient(2deg,#000 0 1px,transparent 1px 5px)}
  #stage::after{content:"";position:absolute;inset:0;z-index:31;pointer-events:none;
    background:radial-gradient(ellipse at 50% 44%,transparent 52%,rgba(6,4,2,.5) 100%)}

  /* 纸面颗粒(大纸面通用:卷宗/封面/结案页) */
  .ppgrain{position:absolute;inset:0;pointer-events:none;opacity:.55;
    background:repeating-linear-gradient(93deg,transparent 0 3px,rgba(90,74,44,.06) 3px 4px,transparent 4px 11px),
               repeating-linear-gradient(2deg,rgba(90,74,44,.07) 0 1px,transparent 1px 5px)}

  /* 氛围层:窗外夜色(地点 mood 驱动,印在档案室墙上) */
  #ambient{position:absolute;inset:0;opacity:0;transition:opacity 2.2s ease,filter 1.1s ease;z-index:0}
  #ambient.on{opacity:1}
  #ambient svg{position:absolute;inset:0;width:100%;height:100%}
  .mote{animation:moteTw 3.4s ease-in-out infinite alternate}
  .mote:nth-of-type(2){animation-delay:.7s}.mote:nth-of-type(3){animation-delay:1.3s}
  .mote:nth-of-type(4){animation-delay:.2s}.mote:nth-of-type(5){animation-delay:1.7s}
  .mote:nth-of-type(6){animation-delay:.9s}.mote:nth-of-type(7){animation-delay:.4s}
  .mote:nth-of-type(8){animation-delay:1.9s}
  @keyframes moteTw{from{opacity:.08}to{opacity:.85}}
  /* 霓虹戏中字:窗外灯牌,映在档案室墙上(纸面之下) */
  #neon{position:absolute;right:6vw;top:16vh;writing-mode:vertical-rl;pointer-events:none;z-index:0;
    font-size:clamp(20px,3.2vh,34px);letter-spacing:.5em;color:var(--accent-cold);opacity:0;
    text-shadow:0 0 6px #4e7d87,0 0 18px rgba(78,125,135,.8),0 0 42px rgba(78,125,135,.5)}
  #neon.on{animation:neonIn 2.2s ease forwards,flick 7s linear 2.3s infinite}
  @keyframes neonIn{0%{opacity:0}18%{opacity:.95}28%{opacity:.15}44%{opacity:1}100%{opacity:.92}}
  @keyframes flick{0%,91%,95%,100%{opacity:.92}93%{opacity:.45}}

  /* 案卷纸面:全高居中纸卷,正文住在这里 */
  #sheet{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
    width:min(880px,88vw);z-index:1;
    background:linear-gradient(90deg,#d6c7a0 0%,#e7dabd 9%,#e4d7b6 50%,#e0d1ac 91%,#d2c29a 100%);
    box-shadow:0 0 0 1px #b3a179,0 0 60px rgba(0,0,0,.6),inset 0 0 110px rgba(112,92,54,.25)}
  #sheet::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 90% 55% at 50% -6%,rgba(255,240,205,.20),transparent 60%)}
  .sh-tab{position:absolute;left:-31px;top:12vh;writing-mode:vertical-rl;
    background:#2a2317;color:#c9b98c;border:1px solid #6d5d3b;border-left:none;
    padding:16px 7px;font-family:var(--kai);font-size:12px;letter-spacing:.42em;border-radius:0 3px 3px 0;
    box-shadow:2px 4px 10px rgba(0,0,0,.4)}
  /* 环境大字:纸面水印 */
  .bigchar{position:absolute;font-family:var(--kai);font-weight:900;pointer-events:none;
    opacity:0;transition:opacity 4s ease}
  .bigchar.on{opacity:.08}
  .bigchar.c1{font-size:44vh;left:5%;top:8vh;color:#3e3320}

  /* 雨幕:窗玻璃上的雨,落在卷宗之前 */
  #rainfx{position:absolute;inset:0;pointer-events:none;overflow:hidden;display:none;z-index:4}
  #rainfx.on{display:block}
  .drop{position:absolute;top:-46px;width:1.8px;transform:rotate(8deg);
    background:linear-gradient(to bottom,rgba(150,170,190,0),rgba(150,170,190,.9));
    animation:dropFall linear infinite}
  .drop.far{width:1px}
  @keyframes dropFall{
    0%{transform:translate(0,0) rotate(8deg)}
    100%{transform:translate(3vw,116vh) rotate(8deg)}}

  /* 文字流(tape):纸上墨字 */
  #tape{position:absolute;inset:0;pointer-events:none;z-index:2}
  #flow{position:absolute;left:50%;width:min(760px,78vw);
    transform:translate(-50%,0);
    transition:transform .95s cubic-bezier(.22,.8,.24,1),opacity .85s ease}
  .ln{font-size:clamp(17px,1.05vw + 1.1vh,26px);line-height:2.05;letter-spacing:.06em;
    color:var(--paper-ink);
    opacity:0;transform:translateY(14px) translateX(var(--dx,0));
    transition:opacity .7s ease,transform .7s ease}
  .ln.in{opacity:1;transform:none}
  .ln.old1{opacity:.55}.ln.old2{opacity:.3}.ln.old3{opacity:.14}
  .ln .who{display:inline-block;font-weight:700;margin-right:1.05em;letter-spacing:.14em;font-family:var(--kai)}
  .ln.dlg{color:#241f14}
  .ln.dlg.lslide{--dx:-16px}
  .ln.choice{display:flex;flex-direction:column;gap:.5em;padding:.5em 0 .2em;pointer-events:auto}
  .opt{display:flex;align-items:center;gap:.9em;cursor:pointer;padding:.32em .2em;
    color:var(--paper-ink);opacity:0;transform:translateX(-14px);
    transition:opacity .6s ease,transform .6s ease,color .25s}
  .opt.in{opacity:1;transform:none}
  .opt:hover{color:var(--blood);transform:translateX(6px)}
  .opt .branch{flex:none;width:2.2em;height:1px;
    background:linear-gradient(90deg,transparent,var(--blood));transition:width .25s}
  .opt:hover .branch{width:3.2em}

  /* 角色锚点(分侧):档案室墙上的竖排名条 */
  .anchor{position:absolute;top:50%;transform:translateY(-50%);
    writing-mode:vertical-rl;letter-spacing:.55em;font-size:15px;font-weight:700;
    font-family:var(--kai);
    opacity:0;transition:opacity 1.4s ease;pointer-events:none;z-index:3}
  .anchor.on{opacity:.85}
  .anchor.r{right:2vw}.anchor.l{left:2vw}

  /* 地点印章:盖在卷宗上的朱砂印 */
  .sealwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3vh;pointer-events:none;transition:opacity .8s ease;z-index:5}
  .seal{border:3px double var(--blood);color:var(--blood);border-radius:8px;
    padding:.28em .5em;font-size:clamp(30px,7vh,64px);font-weight:700;font-family:var(--kai);
    letter-spacing:.18em;line-height:1.3;text-align:center;
    transform:rotate(-7deg);opacity:0;
    box-shadow:inset 0 0 0 2px rgba(158,58,43,.25),0 0 22px rgba(158,58,43,.18);
    text-shadow:0 0 10px rgba(158,58,43,.3)}
  .seal.in{animation:sealIn .55s cubic-bezier(.25,1.2,.35,1) forwards}
  @keyframes sealIn{
    0%{opacity:0;transform:rotate(-7deg) scale(2.1)}
    70%{opacity:1;transform:rotate(-7deg) scale(.96)}
    100%{opacity:.95;transform:rotate(-7deg) scale(1)}}
  .seal-cap{font-family:var(--sans);color:#7c704f;font-size:13px;letter-spacing:.35em;
    opacity:0;transition:opacity 1s ease .3s}
  .seal-cap.in{opacity:.9}

  /* 时间轴带:卷宗眉批 */
  #timeline{position:absolute;top:8.5vh;left:50%;transform:translate(-50%,-16px);
    display:flex;align-items:center;gap:14px;opacity:0;
    transition:opacity .9s ease,transform .9s ease;font-family:var(--sans);pointer-events:none;
    padding:6px 20px;z-index:3;
    border-block:1px solid rgba(51,46,33,.18)}
  #timeline.on{opacity:1;transform:translate(-50%,0)}
  .tl-era{font-size:11px;letter-spacing:.2em;color:#8f8567}
  .tl-track{position:relative;width:min(34vw,420px);height:2px;background:rgba(51,46,33,.35);border-radius:2px}
  .tl-dot{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);
    background:rgba(51,46,33,.4);transition:background .8s ease,box-shadow .8s ease}
  .tl-dot.lit{background:var(--blood);box-shadow:0 0 10px rgba(158,58,43,.7)}
  .tl-dot.now{left:100%;background:var(--blood);animation:dotPulse 2s ease-in-out infinite}
  @keyframes dotPulse{50%{box-shadow:0 0 0 6px rgba(158,58,43,.14)}}
  .tl-tag{position:absolute;top:11px;font-size:10px;letter-spacing:.18em;white-space:nowrap;
    transform:translateX(-50%);color:#8f8567;transition:color .8s ease;visibility:hidden}
  .tl-tag.lit{color:var(--blood);visibility:visible}
  .tl-tag.now{left:100%}

  /* 人物声纹卡:别进卷宗的人物档案条 */
  .charcard{position:absolute;top:50%;transform:translateY(-50%) translateX(-26px);opacity:0;
    transition:all .8s cubic-bezier(.2,1,.3,1);
    background:linear-gradient(150deg,#e9dcbd,#dccfa8);border:1px solid #a8946a;border-radius:3px;
    box-shadow:0 14px 40px rgba(10,7,3,.55),inset 0 0 0 4px rgba(23,19,13,.10);
    padding:1.4em 1.6em;max-width:300px;pointer-events:none;z-index:5}
  .charcard::before,.charcard::after{content:"";position:absolute;width:26px;height:26px;pointer-events:none}
  .charcard::before{top:9px;left:9px;border-top:2px solid #b09657;border-left:2px solid #b09657}
  .charcard::after{right:9px;bottom:9px;border-right:2px solid #b09657;border-bottom:2px solid #b09657}
  .charcard.on{opacity:1;transform:translateY(-50%)}
  .charcard.l{left:3vw}
  .charcard.r{right:3vw;transform:translateY(-50%) translateX(26px)}
  .charcard.r.on{transform:translateY(-50%)}
  .cc-kicker{font-family:var(--sans);font-size:10px;color:#8f8567;letter-spacing:.34em;margin-bottom:.55em}
  .cc-name{font-size:28px;letter-spacing:.28em;font-weight:700;font-family:var(--kai);color:#241f14}
  .cc-wave{display:block;margin:.85em 0 .55em;width:180px;height:36px}
  .cc-wave path{fill:none;stroke-width:1.6;stroke-linecap:round}
  .cc-bio{font-family:var(--sans);font-size:11px;color:#6e6549;letter-spacing:.12em;line-height:1.95}

  /* 章节题签:夹进卷宗的书签纸条 */
  .chcard{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2.6em;
    pointer-events:none;opacity:0;transition:opacity 1.1s ease;z-index:5}
  .chcard .ch-num{writing-mode:vertical-rl;font-family:var(--kai);font-weight:700;
    font-size:clamp(30px,5.4vh,52px);letter-spacing:.5em;color:var(--paper-ink)}
  .chcard .ch-bar{width:1px;height:24vh;background:linear-gradient(rgba(158,58,43,0),rgba(158,58,43,.6),rgba(158,58,43,0))}
  .chcard .ch-title{writing-mode:vertical-rl;font-family:var(--kai);
    font-size:clamp(16px,2.6vh,24px);letter-spacing:.55em;color:#6e6549}
  .chcard .ch-seal{display:flex;align-items:center;justify-content:center;
    width:44px;height:58px;border:2px solid var(--blood);color:var(--blood);
    font-family:var(--kai);font-size:26px;transform:rotate(-6deg);opacity:.8;
    box-shadow:inset 0 0 0 1px rgba(158,58,43,.3)}

  /* HUD / 标题 / 存档 / 结局 */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:2.2vh 2.4vw;pointer-events:none;font-family:var(--sans);z-index:6}
  #hudL .uni{font-size:11px;letter-spacing:.32em;color:#a2956f}
  #hudL .ch{font-size:13px;letter-spacing:.22em;color:var(--ink-dim);margin-top:.55em;opacity:0;transition:opacity 1.2s}
  #hudL .ch.on{opacity:1}
  #hudR{display:flex;flex-direction:column;align-items:flex-end;gap:.55em}
  .bag{display:flex;align-items:center;gap:.6em;font-size:11px;color:#8f8567;letter-spacing:.22em;min-height:22px}
  .chips{display:flex;gap:.5em;flex-wrap:wrap;justify-content:flex-end;max-width:38vw}
  /* 线索 = 证物标签:纸签加红线孔 */
  .chip{position:relative;display:inline-flex;align-items:center;
    background:var(--paper);color:var(--paper-ink);border:1px solid #a8946a;border-radius:2px;
    padding:.28em .85em .28em 1.6em;font-size:11px;letter-spacing:.14em;
    transform:scale(0);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
  .chip::before{content:"";position:absolute;left:.55em;width:5px;height:5px;border-radius:50%;
    background:var(--blood);box-shadow:0 0 0 1px rgba(158,58,43,.35)}
  .chip.in{transform:scale(1)}
  .topbtns{display:flex;gap:8px}
  #stage button{pointer-events:auto;background:#241e14;color:var(--ink);
    border:1px solid #6d5d3b;border-radius:3px;padding:4px 12px;cursor:pointer;
    font-size:12px;font-family:var(--kai);letter-spacing:.16em;
    transition:transform .2s,border-color .2s,color .2s,box-shadow .2s}
  #stage button:hover{border-color:var(--accent);color:#f0e6cd;transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(0,0,0,.5)}

  #hint{position:absolute;bottom:3.4vh;left:50%;transform:translateX(-50%);
    font-family:var(--sans);font-size:12px;letter-spacing:.34em;color:#8f8567;
    opacity:0;transition:opacity .6s;z-index:6;pointer-events:none}
  #hint.on{opacity:.9}

  /* 标题页:卷宗封面 */
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 38%,#241d12 0%,#17130d 70%);z-index:20}
  .t-paper{position:relative;display:flex;flex-direction:column;align-items:center;
    width:min(640px,92vw);padding:5.5vh 5vw 4.5vh;gap:2.4vh;
    background:linear-gradient(150deg,#e9dcbd,#ddd0a9);
    box-shadow:0 30px 90px rgba(0,0,0,.7),inset 0 0 0 4px rgba(23,19,13,.10),inset 0 0 0 5px rgba(168,148,106,.5)}
  .t-paper::before,.t-paper::after{content:"";position:absolute;width:34px;height:34px;pointer-events:none}
  .t-paper::before{top:11px;left:11px;border-top:2px solid #b09657;border-left:2px solid #b09657}
  .t-paper::after{right:11px;bottom:11px;border-right:2px solid #b09657;border-bottom:2px solid #b09657}
  .t-seal{position:absolute;top:24px;right:26px;display:flex;align-items:center;justify-content:center;
    width:50px;height:66px;color:var(--blood);border:2px solid var(--blood);border-radius:3px;
    box-shadow:inset 0 0 0 1px rgba(158,58,43,.35);
    font-family:var(--kai);font-size:32px;transform:rotate(-5deg);opacity:.85}
  .t-kicker{font-family:var(--kai);color:#7c704f;font-size:13px;letter-spacing:.5em}
  #title h1{font-size:clamp(30px,6vh,56px);letter-spacing:.32em;text-indent:.32em;
    font-family:var(--kai);color:#2e2818;font-weight:700}
  .t-rule{display:flex;align-items:center;gap:12px;width:64%;color:var(--blood)}
  .t-rule i{flex:1;height:1px;background:#9b8a65}
  .t-rule span{display:flex;align-items:center;justify-content:center;
    width:24px;height:24px;border:1px solid var(--blood);border-radius:2px;
    font-family:var(--kai);font-size:15px;transform:rotate(-4deg)}
  #gameList{display:flex;flex-direction:column;gap:12px;margin-top:1vh;width:100%}
  #gameList button{background:rgba(255,252,242,.4);border:1px solid #b3a179;border-left:3px solid var(--blood);
    border-radius:2px;color:#2e2818;padding:.8em 3em;font-size:clamp(14px,2.2vh,21px);cursor:pointer;
    letter-spacing:.14em;font-family:var(--kai);
    transition:transform .2s,background .2s,box-shadow .2s}
  #gameList button:hover{background:#f2e8cc;transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,15,8,.25);color:#2e2818}
  #gameList .g-sub{display:block;font-family:var(--sans);font-size:.55em;color:#7c704f;margin-top:.4em;letter-spacing:.2em}
  .t-foot{font-family:var(--sans);color:#857a5b;font-size:11px;letter-spacing:.3em}

  /* 底单回看:抽屉里的转写纸带 */
  #sheetPanel{position:absolute;right:2%;top:10%;width:min(400px,92vw);max-height:70%;overflow:auto;display:none;
    background:linear-gradient(150deg,#e9dcbd,#ddd0a9);border:1px solid #a8946a;border-radius:3px;padding:14px;z-index:21;
    font-family:var(--sans);color:#2e2818;
    box-shadow:0 24px 70px rgba(0,0,0,.7),inset 0 0 0 4px rgba(23,19,13,.10)}
  #sheetPanel.on{display:block}
  #sheetPanel h3{font-size:13px;color:#7c704f;margin-bottom:8px;letter-spacing:.28em;font-family:var(--kai)}
  .tr-row{display:flex;gap:10px;padding:7px 4px;border-bottom:1px dashed rgba(124,112,79,.35);font-size:13px;align-items:baseline}
  .tr-row-caller{flex:none;color:#9e3a2b;font-family:var(--kai);letter-spacing:.1em}
  .tr-row-text{color:#2e2818}

  /* 存档:档案室抽屉里的纸片 */
  #savesPanel{position:absolute;right:2%;top:10%;width:min(360px,92vw);max-height:70%;overflow:auto;display:none;
    background:linear-gradient(150deg,#e9dcbd,#ddd0a9);border:1px solid #a8946a;border-radius:3px;padding:14px;z-index:21;
    font-family:var(--sans);color:#2e2818;
    box-shadow:0 24px 70px rgba(0,0,0,.7),inset 0 0 0 4px rgba(23,19,13,.10)}
  #savesPanel.on{display:block}
  #savesPanel h3{font-size:13px;color:#7c704f;margin-bottom:8px;letter-spacing:.28em;font-family:var(--kai)}
  .save{padding:8px;border-radius:2px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px;
    border-bottom:1px dashed rgba(124,112,79,.4)}
  .save:hover{background:rgba(124,112,79,.12)}

  /* 结局:朱批结案 */
  #endcard{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(12,9,5,.84);opacity:0;pointer-events:none;transition:opacity 1.5s;z-index:22}
  #endcard.on{opacity:1;pointer-events:auto}
  .ec-paper{position:relative;display:flex;flex-direction:column;align-items:center;
    width:min(560px,92vw);max-height:86vh;overflow:auto;padding:4.5vh 6vw;gap:2vh;
    background:linear-gradient(150deg,#e9dcbd,#ddd0a9);
    box-shadow:0 30px 90px rgba(0,0,0,.7),inset 0 0 0 4px rgba(23,19,13,.10),inset 0 0 0 5px rgba(168,148,106,.5)}
  .ec-paper::before,.ec-paper::after{content:"";position:absolute;width:30px;height:30px;pointer-events:none}
  .ec-paper::before{top:10px;left:10px;border-top:2px solid #b09657;border-left:2px solid #b09657}
  .ec-paper::after{right:10px;bottom:10px;border-right:2px solid #b09657;border-bottom:2px solid #b09657}
  .ec-seal{display:flex;align-items:center;justify-content:center;
    width:54px;height:68px;border:3px double var(--blood);color:var(--blood);border-radius:6px;
    font-family:var(--kai);font-size:34px;transform:rotate(-7deg);opacity:.85;
    box-shadow:inset 0 0 0 2px rgba(158,58,43,.25)}
  .ec-label{color:var(--blood);letter-spacing:.5em;font-size:clamp(11px,1.6vh,16px);font-family:var(--kai)}
  #endTitle{font-size:clamp(26px,5vh,46px);letter-spacing:.22em;font-family:var(--kai);color:#2e2818;font-weight:700}
  #endCollected{color:#7c704f;font-size:clamp(11px,1.6vh,14px);line-height:1.9;font-family:var(--sans);text-align:center}
  .ec-btns{display:flex;gap:1.4em;margin-top:1vh}
  .ec-btns button{background:#7c2f24;border-color:#a85c45;color:#f0dfb8;padding:.55em 1.8em;font-size:14px}
  .ec-btns button:hover{background:#87392c;border-color:#d49a6d;color:#f6e8c4}
  .ec-btns #btnBackTitle{background:transparent;border-color:#8d8063;color:#655c48}
  .ec-btns #btnBackTitle:hover{color:#2e2a20;background:#d9cba4}

  #toast{position:absolute;top:9%;left:50%;transform:translateX(-50%);
    background:#e9dcbd;border:1px solid #a8946a;border-left:3px solid var(--blood);border-radius:2px;
    padding:6px 18px;font-size:13px;font-family:var(--sans);color:#2e2818;
    box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .3s;
    pointer-events:none;z-index:40}
  #toast.on{opacity:1}

  @media (prefers-reduced-motion:reduce){
    .drop,.mote,#stage.shake{animation:none!important}
  }

/* 转写交互（g01 原语）:呼机留言纸带 */
.tr{display:flex;flex-direction:column;gap:8px;padding:14px 18px;max-width:560px;margin:6px auto 0;
    border:1px solid #a8946a;border-radius:2px;background:rgba(255,252,242,.5);
    opacity:0;transform:translateY(8px);transition:all .5s;position:relative}
.tr::before{content:"";position:absolute;left:8px;right:8px;top:4px;border-top:1px dashed rgba(124,112,79,.5)}
.tr.in{opacity:1;transform:none}
.tr-caller{font-size:12px;color:var(--blood,#9e3a2b);letter-spacing:2px;font-family:var(--kai)}
.tr-in{font:inherit;font-size:16px;color:#332e21;background:rgba(51,46,33,.06);border:1px solid #8b7f5e;border-radius:2px;padding:9px 12px;outline:none}
.tr-in:focus{border-color:var(--accent-cold,#4e7d87)}
.tr-send{align-self:flex-end;font:inherit;font-size:14px;color:#f0ead8;background:var(--accent-cold,#4e7d87);border:none;border-radius:2px;padding:7px 16px;cursor:pointer;letter-spacing:2px;font-family:var(--kai)}
.tr-send:hover{background:#5b8e99;color:#fff}
.tr-hint{font-size:12px;color:rgba(110,101,73,.85);cursor:pointer}
  .tr-hint:hover{color:#9e3a2b}
.tr-done{font-size:14px;color:rgba(46,40,24,.9);padding:10px 4px;letter-spacing:1px}

  /* 响应式:中屏收边饰,窄屏保正文 */
  @media (max-width:900px){
    #sheet{width:94vw}
    #flow{width:min(760px,84vw)}
    .anchor{display:none}
    #neon{display:none}
    .charcard{max-width:262px}
    .cc-wave{width:150px}
  }
  @media (max-width:520px){
    #hud button{font-size:11px;padding:3px 7px;letter-spacing:1px}
    #hud{gap:6px}
    .sh-tab{display:none}
    .t-seal{top:14px;right:14px;width:38px;height:52px;font-size:24px}
    .tl-track{width:30vw}
    #toast{font-size:12px}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="ambient"></div>
  <div id="neon"></div>

  <div id="sheet">
    <div class="sh-tab">案卷</div>
    <div class="ppgrain"></div>
    <div class="bigchar c1" id="bc1"></div>
  </div>

  <div id="tape"><div id="flow"></div></div>
  <div id="anchors"></div>
  <div id="rainfx"></div>

  <div id="hud">
    <div id="hudL">
      <div class="uni" id="worldLabel"></div>
      <div class="ch" id="chapterLabel"></div>
    </div>
    <div id="hudR">
      <div class="bag"><span>证物</span><span class="chips" id="clues"></span></div>
      <div class="topbtns">
        <button id="btnSheet">底单</button>
        <button id="btnSaves">存档</button>
        <button id="btnRestart">重新开始</button>
        <button id="btnMute">♪ 音效</button>
        <button id="btnTitle">标题</button>
      </div>
    </div>
  </div>

  <div id="timeline"></div>
  <div id="hint">点击 · 空格 —— 继续 ▸</div>

  <div id="title">
    <div class="t-paper">
      <div class="ppgrain"></div>
      <div class="t-seal">锦</div>
      <div class="t-kicker">锦江悬疑宇宙 · 文字舞台</div>
      <h1>档 案 库</h1>
      <div class="t-rule"><i></i><span>卷</span><i></i></div>
      <div id="gameList"></div>
      <div class="t-foot">灯下摊开的卷宗 · 点击与空格推进</div>
    </div>
  </div>

  <div id="savesPanel"><h3>读取存档</h3><div id="savesList"></div></div>
  <div id="sheetPanel"><h3>转写底单 · 本局</h3><div id="sheetList"></div></div>

  <div id="endcard">
    <div class="ec-paper">
      <div class="ppgrain"></div>
      <div class="ec-seal">结</div>
      <div class="ec-label">— 案卷终页 —</div>
      <div id="endTitle"></div>
      <div id="endCollected"></div>
      <div class="ec-btns">
        <button id="btnAgain">翻页重开</button>
        <button id="btnBackTitle">回到封面</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>
<script type="module" src="/player.mjs"></script>
</body>
</html>
