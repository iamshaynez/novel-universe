<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>测试02 · 雨夜街道 — 悬疑/都市怪谈路线</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #07090f;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 28px 16px 48px;
  }
  h1 { color: #d6e4f2; font-size: 18px; font-weight: 600; letter-spacing: .08em; margin-bottom: 6px; }
  .note { color: #7d8ba0; font-size: 13px; margin-bottom: 18px; }
  .frame {
    width: min(1100px, 100%); aspect-ratio: 16 / 9;
    border-radius: 14px; overflow: hidden; position: relative;
    box-shadow: 0 24px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.05);
    background: #0b1424;
  }
  svg { width: 100%; height: 100%; display: block; }

  /* 雨幕：渐变本身带倾角，每个 tile 内一条斜向雨丝，两层视差 */
  .rain {
    position: absolute; inset: -10% 0;
    pointer-events: none;
    background-image: linear-gradient(166deg,
      rgba(190,222,255,0) 42%, rgba(190,222,255,.65) 50%, rgba(190,222,255,0) 58%);
    background-size: 34px 120px;
  }
  .rain.a { animation: fallA .55s linear infinite; opacity: .8; }
  .rain.b { animation: fallB .9s linear infinite; opacity: .45; background-size: 46px 160px; background-position: 20px 0; }
  @keyframes fallA { to { background-position: 0 120px; } }
  @keyframes fallB { to { background-position: 20px 160px; } }

  /* 霓虹闪烁 */
  .neon { animation: neon 6s infinite; }
  @keyframes neon {
    0%, 100% { opacity: 1; } 41% { opacity: 1; } 42% { opacity: .35; }
    43% { opacity: 1; } 45% { opacity: .5; } 46% { opacity: 1; }
    78% { opacity: 1; } 79% { opacity: .2; } 80.5% { opacity: 1; }
  }

  /* 故障字 */
  .glitch {
    position: absolute; top: 26px; left: 34px;
    font-family: "Songti SC","Noto Serif SC",serif;
    font-size: 30px; letter-spacing: .3em; color: #d8ecff;
    text-shadow: 0 0 18px rgba(125,227,255,.45);
  }
  .glitch::before, .glitch::after {
    content: attr(data-t); position: absolute; left: 0; top: 0;
  }
  .glitch::before { color: #7de3ff; animation: g1 4s infinite steps(1); }
  .glitch::after  { color: #ff7da8; animation: g2 5s infinite steps(1); }
  @keyframes g1 { 0%,92%,100% { transform: translate(0,0); opacity: 0; } 93% { transform: translate(-3px,1px); opacity: .9; } 96% { transform: translate(2px,-1px); opacity: .9; } }
  @keyframes g2 { 0%,88%,100% { transform: translate(0,0); opacity: 0; } 89% { transform: translate(3px,0); opacity: .8; } 92% { transform: translate(-2px,1px); opacity: .8; } }

  .lampglow { animation: breathe 4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes breathe { from { opacity: .85; } to { opacity: 1; } }
</style>
</head>
<body>
<h1>测试 02 · 雨夜街道 —— 悬疑 / 都市怪谈路线</h1>
<p class="note">看点：低饱和蓝黑 + 单点暖光 + 雨幕/霓虹故障演出；剪影人物在夜景里几乎零成本。</p>

<div class="frame">
<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#0e2033"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffc46b" stop-opacity="0.22"/>
      <stop offset="1"   stop-color="#ffc46b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcd82" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffcd82" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1322"/>
      <stop offset="1" stop-color="#060b16"/>
    </linearGradient>
    <radialGradient id="coldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#8cd2ff" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#8cd2ff" stop-opacity="0.11"/>
      <stop offset="1"   stop-color="#8cd2ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="neonF" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg2)"/>
  <!-- 稀疏星光 -->
  <g fill="#bcd8ff" opacity=".5">
    <circle cx="120" cy="60" r="1.4"/><circle cx="300" cy="36" r="1"/>
    <circle cx="520" cy="70" r="1.2"/><circle cx="700" cy="30" r="1"/>
    <circle cx="900" cy="56" r="1.4"/><circle cx="1150" cy="40" r="1.1"/>
  </g>

  <!-- 左侧楼群 -->
  <g>
    <path d="M0 560 L0 66 L250 66 L250 560 Z" fill="#0d1526"/>
    <g fill="#ffca7a" opacity=".75">
      <rect x="30" y="100" width="10" height="13"/><rect x="70" y="100" width="10" height="13"/>
      <rect x="110" y="160" width="10" height="13"/><rect x="150" y="100" width="10" height="13"/>
      <rect x="30" y="220" width="10" height="13"/><rect x="110" y="280" width="10" height="13"/>
      <rect x="190" y="220" width="10" height="13"/><rect x="70" y="340" width="10" height="13"/>
      <rect x="150" y="400" width="10" height="13"/><rect x="30" y="460" width="10" height="13"/>
      <rect x="190" y="460" width="10" height="13"/>
    </g>
    <g fill="#7de3ff" opacity=".55">
      <rect x="70" y="160" width="10" height="13"/><rect x="190" y="340" width="10" height="13"/>
      <rect x="110" y="460" width="10" height="13"/>
    </g>
    <!-- 霓虹招牌 -->
    <g class="neon" filter="url(#neonF)">
      <rect x="176" y="128" width="46" height="188" rx="7" fill="rgba(125,227,255,.07)" stroke="#7de3ff" stroke-width="2.5"/>
      <g fill="#c8f4ff" font-family="'Songti SC','Noto Serif SC',serif" font-size="30" text-anchor="middle">
        <text x="199" y="168">夜</text><text x="199" y="208">半</text>
        <text x="199" y="248">茶</text><text x="199" y="288">寮</text>
      </g>
    </g>
  </g>

  <!-- 右侧楼群 -->
  <g>
    <path d="M1000 560 L1000 108 L1280 108 L1280 560 Z" fill="#0c1220"/>
    <g fill="#ffca7a" opacity=".7">
      <rect x="1030" y="140" width="10" height="13"/><rect x="1070" y="200" width="10" height="13"/>
      <rect x="1110" y="140" width="10" height="13"/><rect x="1190" y="260" width="10" height="13"/>
      <rect x="1150" y="320" width="10" height="13"/><rect x="1230" y="140" width="10" height="13"/>
      <rect x="1030" y="380" width="10" height="13"/><rect x="1190" y="440" width="10" height="13"/>
    </g>
    <g fill="#7de3ff" opacity=".5">
      <rect x="1150" y="200" width="10" height="13"/><rect x="1070" y="440" width="10" height="13"/>
    </g>
  </g>

  <!-- 中景低楼 -->
  <rect x="240" y="470" width="762" height="92" fill="#0a111d"/>
  <circle cx="330" cy="458" r="16" fill="#0a111d"/>
  <rect x="560" y="452" width="40" height="20" fill="#0a111d"/>

  <!-- 路灯 -->
  <g>
    <rect x="884" y="230" width="10" height="332" fill="#182334"/>
    <path d="M889 240 Q889 196 845 196" stroke="#182334" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="824" y="192" width="42" height="15" rx="7" fill="#1f2b3e"/>
    <polygon points="828,207 862,207 944,560 748,560" fill="url(#cone)"/>
    <circle class="lampglow" cx="845" cy="216" r="112" fill="url(#warm)"/>
    <ellipse cx="845" cy="211" rx="16" ry="8" fill="#ffe9c4"/>
  </g>

  <!-- 灯下远景人影（背对，悬念） -->
  <g>
    <circle cx="843" cy="492" r="11" fill="#0c1526"/>
    <path d="M833 504 L853 504 L857 558 L829 558 Z" fill="#0c1526"/>
    <path d="M854 504 Q862 526 860 556" stroke="rgba(255,215,150,.6)" stroke-width="2" fill="none"/>
    <path d="M832 504 Q826 528 828 556" stroke="rgba(255,215,150,.3)" stroke-width="1.6" fill="none"/>
  </g>

  <!-- 主角少女（透明伞，背后冷色微光做人物/背景分离） -->
  <g>
    <ellipse cx="420" cy="386" rx="150" ry="175" fill="url(#coldGlow)"/>
    <line x1="420" y1="286" x2="420" y2="272" stroke="#cfe2ff" stroke-width="3" opacity=".7"/>
    <path d="M328 318 Q420 250 512 318 Q497 306 482 318 Q467 306 452 318 Q437 306 422 318
             Q407 306 392 318 Q377 306 362 318 Q347 306 328 318 Z"
          fill="rgba(190,224,255,.22)" stroke="rgba(205,232,255,.85)" stroke-width="2.5"/>
    <!-- 伞面受路灯一侧的暖色高光 -->
    <path d="M420 252 Q468 280 508 315" stroke="rgba(255,205,130,.55)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <line x1="420" y1="318" x2="420" y2="392" stroke="#0e1626" stroke-width="4"/>
    <path d="M404 352 L436 352 L444 472 Q420 480 396 472 Z" fill="#1d3152"/>
    <path d="M420 308 Q396 308 396 336 Q396 358 408 362 L432 362 Q444 358 444 336 Q444 308 420 308 Z" fill="#1d3152"/>
    <circle cx="420" cy="334" r="19" fill="#1d3152"/>
    <path d="M408 364 Q412 382 420 390" stroke="#1d3152" stroke-width="9" fill="none" stroke-linecap="round"/>
    <line x1="414" y1="470" x2="414" y2="520" stroke="#1d3152" stroke-width="8" stroke-linecap="round"/>
    <line x1="426" y1="470" x2="426" y2="520" stroke="#1d3152" stroke-width="8" stroke-linecap="round"/>
    <rect x="407" y="516" width="15" height="8" rx="3" fill="#1d3152"/>
    <rect x="419" y="516" width="15" height="8" rx="3" fill="#1d3152"/>
    <!-- 轮廓勾边：霓虹侧冷色 + 路灯侧暖色 -->
    <g fill="none" stroke-linecap="round">
      <path d="M398 314 Q390 344 400 362" stroke="rgba(140,222,255,.75)" stroke-width="2.5"/>
      <path d="M438 328 Q446 346 442 364" stroke="rgba(255,205,130,.45)" stroke-width="2.5"/>
      <path d="M442 360 L448 470" stroke="rgba(255,205,130,.35)" stroke-width="2"/>
    </g>
  </g>

  <!-- 地面 -->
  <rect x="0" y="558" width="1280" height="162" fill="url(#road)"/>
  <line x1="0" y1="560" x2="1280" y2="560" stroke="rgba(160,200,255,.16)" stroke-width="1.5"/>
  <g fill="rgba(200,220,255,.10)">
    <rect x="60"  y="640" width="58" height="6" rx="3"/>
    <rect x="244" y="640" width="58" height="6" rx="3"/>
    <rect x="428" y="640" width="58" height="6" rx="3"/>
    <rect x="612" y="640" width="58" height="6" rx="3"/>
    <rect x="796" y="640" width="58" height="6" rx="3"/>
    <rect x="980" y="640" width="58" height="6" rx="3"/>
    <rect x="1164" y="640" width="58" height="6" rx="3"/>
  </g>
  <!-- 湿地反光（光锥落点的地面光斑，把灯「锚」在地面上） -->
  <ellipse cx="845" cy="563" rx="102" ry="11" fill="rgba(255,205,130,.26)"/>
  <ellipse cx="845" cy="600" rx="95" ry="13" fill="rgba(255,205,130,.16)"/>
  <rect x="832" y="560" width="26" height="86" fill="rgba(255,205,130,.12)" filter="url(#blur6)"/>
  <ellipse cx="420" cy="642" rx="72" ry="9" fill="none" stroke="rgba(150,200,255,.13)" stroke-width="2"/>

  <!-- 对话框 -->
  <g font-family="'Songti SC','Noto Serif SC',serif">
    <rect x="70" y="584" width="1140" height="112" rx="14" fill="#081020" opacity="0.9"
          stroke="#7de3ff" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="100" y="566" width="92" height="34" rx="8" fill="#12314a"/>
    <text x="146" y="589" text-anchor="middle" font-size="19" fill="#9fdcff" font-weight="700">？？？</text>
    <text x="110" y="644" font-size="25" fill="#dceafe" letter-spacing="1">「……雨，什么时候才会停呢。」</text>
  </g>
</svg>

<div class="rain a"></div>
<div class="rain b"></div>
<div class="glitch" data-t="她还没有回家">她还没有回家</div>
</div>
</body>
</html>
