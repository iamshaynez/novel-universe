<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>锦江悬疑宇宙 · 文字舞台</title>
<style>
  /* 文字舞台播放器 —— 排版即运镜。
     调色板与 universe/tokens.json 的 stage 令牌对齐(单一事实源,改一处同步一处)。 */
  :root{
    --bg:#0b0810; --ink:#efe8f5; --ink-dim:#9a8aad;
    --paper:#f2ecdc; --paper-ink:#3a2d45;
    --accent:#ffb37a; --accent-cold:#7de3ff; --blood:#e0523f;
    --serif:"Songti SC","Noto Serif SC","Noto Serif CJK SC",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden}
  #stage{position:relative;height:100vh;overflow:hidden;user-select:none}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 44%,transparent 55%,rgba(5,3,12,.5) 100%)}

  /* 氛围层 + 雨幕 + 环境大字 + 霓虹戏中字 */
  #ambient{position:absolute;inset:0;opacity:0;transition:opacity 2.2s ease,filter 1.1s ease}
  #ambient.on{opacity:1}
  #ambient svg{position:absolute;inset:0;width:100%;height:100%}
  .mote{animation:moteTw 3.4s ease-in-out infinite alternate}
  .mote:nth-of-type(2){animation-delay:.7s}.mote:nth-of-type(3){animation-delay:1.3s}
  .mote:nth-of-type(4){animation-delay:.2s}.mote:nth-of-type(5){animation-delay:1.7s}
  .mote:nth-of-type(6){animation-delay:.9s}.mote:nth-of-type(7){animation-delay:.4s}
  .mote:nth-of-type(8){animation-delay:1.9s}
  @keyframes moteTw{from{opacity:.08}to{opacity:.85}}
  #rainfx{position:absolute;inset:0;pointer-events:none;overflow:hidden;display:none}
  #rainfx.on{display:block}
  .drop{position:absolute;top:-46px;width:1.8px;transform:rotate(8deg);
    background:linear-gradient(to bottom,rgba(170,200,255,0),rgba(170,200,255,.9));
    animation:dropFall linear infinite}
  .drop.far{width:1px}
  @keyframes dropFall{
    0%{transform:translate(0,0) rotate(8deg)}
    100%{transform:translate(3vw,116vh) rotate(8deg)}}
  .bigchar{position:absolute;font-family:var(--serif);font-weight:900;pointer-events:none;
    opacity:0;transition:opacity 4s ease}
  .bigchar.on{opacity:.055}
  .bigchar.c1{font-size:44vh;left:5vw;top:9vh;color:var(--accent-cold)}
  #neon{position:absolute;right:6.5vw;top:16vh;writing-mode:vertical-rl;pointer-events:none;
    font-size:clamp(20px,3.2vh,34px);letter-spacing:.5em;color:var(--accent-cold);opacity:0;
    text-shadow:0 0 6px #7de3ff,0 0 18px rgba(125,227,255,.8),0 0 42px rgba(125,227,255,.5)}
  #neon.on{animation:neonIn 2.2s ease forwards,flick 7s linear 2.3s infinite}
  @keyframes neonIn{0%{opacity:0}18%{opacity:.95}28%{opacity:.15}44%{opacity:1}100%{opacity:.92}}
  @keyframes flick{0%,91%,95%,100%{opacity:.92}93%{opacity:.45}}

  /* 文字流(tape) */
  #tape{position:absolute;inset:0;pointer-events:none}
  #flow{position:absolute;left:50%;width:min(920px,80vw);
    transform:translate(-50%,0);
    transition:transform .95s cubic-bezier(.22,.8,.24,1),opacity .85s ease}
  .ln{font-size:clamp(17px,1.05vw + 1.1vh,26px);line-height:2.05;letter-spacing:.06em;
    opacity:0;transform:translateY(14px) translateX(var(--dx,0));
    transition:opacity .7s ease,transform .7s ease}
  .ln.in{opacity:1;transform:none}
  .ln.old1{opacity:.55}.ln.old2{opacity:.3}.ln.old3{opacity:.14}
  .ln .who{display:inline-block;font-weight:700;margin-right:1.05em;letter-spacing:.14em}
  .ln.dlg{color:#fff6ec}
  .ln.dlg.lslide{--dx:-16px}
  .ln.choice{display:flex;flex-direction:column;gap:.5em;padding:.5em 0 .2em;pointer-events:auto}
  .opt{display:flex;align-items:center;gap:.9em;cursor:pointer;padding:.32em .2em;
    color:var(--ink);opacity:0;transform:translateX(-14px);
    transition:opacity .6s ease,transform .6s ease,color .25s}
  .opt.in{opacity:1;transform:none}
  .opt:hover{color:var(--accent);transform:translateX(6px)}
  .opt .branch{flex:none;width:2.2em;height:1px;
    background:linear-gradient(90deg,transparent,var(--accent));transition:width .25s}
  .opt:hover .branch{width:3.2em}

  /* 角色锚点(分侧) */
  .anchor{position:absolute;top:50%;transform:translateY(-50%);
    writing-mode:vertical-rl;letter-spacing:.55em;font-size:15px;font-weight:700;
    opacity:0;transition:opacity 1.4s ease;pointer-events:none}
  .anchor.on{opacity:.85}
  .anchor.r{right:2.4vw}.anchor.l{left:2.4vw}

  /* 地点印章 */
  .sealwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3vh;pointer-events:none;transition:opacity .8s ease}
  .seal{border:3px solid var(--blood);color:var(--blood);border-radius:12px;
    padding:.28em .5em;font-size:clamp(30px,7vh,64px);font-weight:900;
    letter-spacing:.18em;line-height:1.3;text-align:center;
    transform:rotate(-7deg);opacity:0;box-shadow:inset 0 0 16px rgba(224,82,63,.28)}
  .seal.in{animation:sealIn .55s cubic-bezier(.25,1.2,.35,1) forwards}
  @keyframes sealIn{
    0%{opacity:0;transform:rotate(-7deg) scale(2.1)}
    70%{opacity:1;transform:rotate(-7deg) scale(.96)}
    100%{opacity:.95;transform:rotate(-7deg) scale(1)}}
  .seal-cap{font-family:var(--sans);color:var(--ink-dim);font-size:13px;letter-spacing:.35em;
    opacity:0;transition:opacity 1s ease .3s}
  .seal-cap.in{opacity:.9}

  /* 时间轴带 */
  #timeline{position:absolute;top:9.5vh;left:50%;transform:translate(-50%,-16px);
    display:flex;align-items:center;gap:14px;opacity:0;
    transition:opacity .9s ease,transform .9s ease;font-family:var(--sans);pointer-events:none}
  #timeline.on{opacity:1;transform:translate(-50%,0)}
  .tl-era{font-size:12px;letter-spacing:.2em;color:var(--ink-dim)}
  .tl-track{position:relative;width:min(34vw,420px);height:2px;background:#332a48;border-radius:2px}
  .tl-dot{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);
    background:#4a3f63;transition:background .8s ease,box-shadow .8s ease}
  .tl-dot.lit{background:var(--blood);box-shadow:0 0 12px rgba(224,82,63,.85)}
  .tl-dot.now{left:100%;background:var(--accent);animation:dotPulse 2s ease-in-out infinite}
  @keyframes dotPulse{50%{box-shadow:0 0 0 6px rgba(255,179,122,.14)}}
  .tl-tag{position:absolute;top:11px;font-size:10px;letter-spacing:.18em;white-space:nowrap;
    transform:translateX(-50%);color:var(--ink-dim);transition:color .8s ease}
  .tl-tag.lit{color:#d98a80}
  .tl-tag.now{left:100%}

  /* 人物声纹卡 */
  .charcard{position:absolute;top:50%;transform:translateY(-50%) translateX(-26px);opacity:0;
    transition:all .8s cubic-bezier(.2,1,.3,1);
    background:rgba(16,11,34,.92);border:1px solid rgba(255,255,255,.22);border-radius:10px;
    padding:1.5em 1.7em;max-width:300px;pointer-events:none;z-index:5}
  .charcard.on{opacity:1;transform:translateY(-50%)}
  .charcard.l{left:3vw}
  .charcard.r{right:3vw;transform:translateY(-50%) translateX(26px)}
  .charcard.r.on{transform:translateY(-50%)}
  .cc-name{font-size:29px;letter-spacing:.3em;font-weight:700}
  .cc-wave{display:block;margin:.85em 0 .55em;width:180px;height:36px}
  .cc-wave path{fill:none;stroke-width:1.6;stroke-linecap:round}
  .cc-bio{font-family:var(--sans);font-size:11px;color:var(--ink-dim);letter-spacing:.12em;line-height:1.95}

  /* HUD / 标题 / 存档 / 结局 */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:2.2vh 2.4vw;pointer-events:none;font-family:var(--sans);z-index:6}
  #hudL .uni{font-size:11px;letter-spacing:.32em;color:#7a6f8c}
  #hudL .ch{font-size:13px;letter-spacing:.22em;color:var(--ink-dim);margin-top:.55em;opacity:0;transition:opacity 1.2s}
  #hudL .ch.on{opacity:1}
  #hudR{display:flex;flex-direction:column;align-items:flex-end;gap:.55em}
  .bag{display:flex;align-items:center;gap:.6em;font-size:11px;color:#7a6f8c;letter-spacing:.22em;min-height:22px}
  .chips{display:flex;gap:.5em;flex-wrap:wrap;justify-content:flex-end;max-width:38vw}
  .chip{background:transparent;color:var(--accent);border:1px solid rgba(255,179,122,.5);border-radius:7px;
    padding:.28em .85em;font-size:11px;letter-spacing:.14em;transform:scale(0);
    transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
  .chip.in{transform:scale(1)}
  .topbtns{display:flex;gap:8px}
  #stage button{pointer-events:auto;background:rgba(18,10,34,.8);color:var(--ink-dim);
    border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:4px 12px;cursor:pointer;
    font-size:12px;font-family:var(--sans)}
  #stage button:hover{border-color:var(--accent);color:var(--accent)}

  #hint{position:absolute;bottom:3.4vh;left:50%;transform:translateX(-50%);
    font-family:var(--sans);font-size:12px;letter-spacing:.34em;color:#6d5f80;
    opacity:0;transition:opacity .6s;z-index:6}
  #hint.on{opacity:.9}

  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3vh;background:radial-gradient(ellipse at 50% 40%, #241536 0%, #0b0810 70%);z-index:8}
  #title .sub{color:#9a8aad;font-size:clamp(11px,1.7vh,16px);letter-spacing:.5em;font-family:var(--sans)}
  #title h1{font-size:clamp(28px,6vh,58px);letter-spacing:.3em;text-indent:.3em}
  #gameList{display:flex;flex-direction:column;gap:12px;margin-top:2vh}
  #gameList button{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,179,122,.5);border-radius:12px;
    color:var(--ink);padding:.8em 3em;font-size:clamp(14px,2.2vh,22px);cursor:pointer;letter-spacing:.15em;
    font-family:var(--serif)}
  #gameList button:hover{background:rgba(255,179,122,.15)}
  #gameList .g-sub{display:block;font-size:.55em;color:#9a8aad;margin-top:.4em;letter-spacing:.2em}

  #savesPanel{position:absolute;right:2%;top:10%;width:30%;max-height:70%;overflow:auto;display:none;
    background:rgba(18,10,34,.95);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:14px;z-index:9;
    font-family:var(--sans)}
  #savesPanel.on{display:block}
  #savesPanel h3{font-size:13px;color:#9a8aad;margin-bottom:8px;letter-spacing:.2em}
  .save{padding:8px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px}
  .save:hover{background:rgba(255,255,255,.08)}

  #endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2.4vh;background:rgba(5,3,12,.9);opacity:0;pointer-events:none;transition:opacity 1.5s;z-index:8}
  #endcard.on{opacity:1;pointer-events:auto}
  .ec-label{color:var(--accent);letter-spacing:.5em;font-size:clamp(11px,1.6vh,16px);font-family:var(--sans)}
  #endTitle{font-size:clamp(28px,6vh,56px);letter-spacing:.24em}
  #endCollected{color:#9a8aad;font-size:clamp(11px,1.6vh,15px);line-height:1.9;font-family:var(--sans);text-align:center}
  .ec-btns{display:flex;gap:1.4em;margin-top:1.2vh}
  .ec-btns button{background:transparent;border:1px solid rgba(255,179,122,.5);color:var(--accent);
    padding:.6em 1.9em;border-radius:8px;font-size:13px;letter-spacing:.2em}

  #toast{position:absolute;top:9%;left:50%;transform:translateX(-50%);
    background:rgba(18,10,34,.92);border:1px solid rgba(255,179,122,.5);border-radius:8px;
    padding:6px 18px;font-size:13px;font-family:var(--sans);opacity:0;transition:opacity .3s;
    pointer-events:none;z-index:10}
  #toast.on{opacity:1}

  @media (prefers-reduced-motion:reduce){
    .drop,.mote,#stage.shake{animation:none!important}
  }

/* 转写交互（g01 原语） */
.tr{display:flex;flex-direction:column;gap:8px;padding:14px 18px;border:1px solid rgba(125,227,255,.35);border-radius:8px;background:rgba(18,49,82,.18);max-width:560px;margin:6px auto 0;opacity:0;transform:translateY(8px);transition:all .5s}
.tr.in{opacity:1;transform:none}
.tr-caller{font-size:12px;color:var(--cold,#7de3ff);letter-spacing:2px}
.tr-in{font:inherit;font-size:15px;color:var(--ink,#efe8f5);background:rgba(11,8,16,.7);border:1px solid rgba(239,232,245,.25);border-radius:6px;padding:9px 12px;outline:none}
.tr-in:focus{border-color:var(--cold,#7de3ff)}
.tr-send{align-self:flex-end;font:inherit;font-size:14px;color:#0b0810;background:var(--cold,#7de3ff);border:none;border-radius:6px;padding:7px 16px;cursor:pointer;letter-spacing:2px}
.tr-hint{font-size:12px;color:rgba(239,232,245,.55)}
.tr-done{font-size:14px;color:rgba(239,232,245,.8);padding:10px 4px;letter-spacing:1px}

  /* 窄面板：HUD 缩小，避开正文滚动区 */
  @media (max-width:520px){
    #hud button{font-size:11px;padding:3px 7px;letter-spacing:1px}
    #hud{gap:6px}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="ambient"></div>
  <div id="rainfx"></div>
  <div class="bigchar c1" id="bc1"></div>
  <div id="neon"></div>

  <div id="tape"><div id="flow"></div></div>
  <div id="anchors"></div>

  <div id="hud">
    <div id="hudL">
      <div class="uni" id="worldLabel"></div>
      <div class="ch" id="chapterLabel"></div>
    </div>
    <div id="hudR">
      <div class="bag"><span>线索</span><span class="chips" id="clues"></span></div>
      <div class="topbtns">
        <button id="btnSaves">存档</button>
        <button id="btnRestart">重新开始</button>
        <button id="btnMute">♪ 音效</button>
        <button id="btnTitle">标题</button>
      </div>
    </div>
  </div>

  <div id="timeline"></div>
  <div id="hint">点击 · 空格 —— 继续 ▸</div>

  <div id="title">
    <div class="sub">锦江悬疑宇宙 · 文字舞台</div>
    <h1>档案库</h1>
    <div id="gameList"></div>
  </div>

  <div id="savesPanel"><h3>读取存档</h3><div id="savesList"></div></div>

  <div id="endcard">
    <div class="ec-label">— 结局 —</div>
    <div id="endTitle"></div>
    <div id="endCollected"></div>
    <div class="ec-btns">
      <button id="btnAgain">再玩一次</button>
      <button id="btnBackTitle">回到标题</button>
    </div>
  </div>

  <div id="toast"></div>
</div>
<script type="module" src="/player.mjs"></script>
</body>
</html>
