<style>
  /* 文字舞台播放器 —— 排版即运镜。
     案卷画风：深夜档案室，灯下一册摊开的卷宗。正文住纸上，演出词汇（印章/声纹/时间轴）皆为卷宗批注。
     调色板与 universe/tokens.json 的 stage 令牌对齐(单一事实源,改一处同步一处)。 */
  :root{
    --bg:#17130d; --ink:#e6dabb; --ink-dim:#8f8567;
    --paper:#e4d6b3; --paper-ink:#332e21;
    --ink-deep:#241f14; --accent:#c9a15f; --accent-ink:#7d6226;
    --accent-cold:#4e7d87; --blood:#9e3a2b;
    --serif:"Songti SC","Noto Serif SC","Noto Serif CJK SC",serif;
    --kai:"Kaiti SC","STKaiti","KaiTi","Songti SC","Noto Serif SC",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{position:fixed;inset:0;background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden}
  #stage{position:relative;height:100vh;height:100dvh;overflow:hidden;user-select:none;
    -webkit-touch-callout:none;touch-action:none}
  /* 档案室空气:全屏纸纹颗粒 + 暗角 */
  #stage::before{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;
    opacity:.07;mix-blend-mode:soft-light;
    background:repeating-linear-gradient(93deg,transparent 0 3px,#fff 3px 4px,transparent 4px 11px),
               repeating-linear-gradient(2deg,#000 0 1px,transparent 1px 5px)}
  #stage::after{content:"";position:absolute;inset:0;z-index:31;pointer-events:none;
    background:radial-gradient(ellipse at 50% 44%,transparent 52%,rgba(6,4,2,.5) 100%)}

  /* 纸面颗粒(大纸面通用:卷宗/封面/结案页) */
  .ppgrain{position:absolute;inset:0;pointer-events:none;opacity:.55;
    background:repeating-linear-gradient(93deg,transparent 0 3px,rgba(90,74,44,.06) 3px 4px,transparent 4px 11px),
               repeating-linear-gradient(2deg,rgba(90,74,44,.07) 0 1px,transparent 1px 5px)}

  /* 氛围层:窗外夜色(地点 mood 驱动,印在档案室墙上) */
  #ambient{position:absolute;inset:0;opacity:0;transition:opacity 2.2s ease,filter 1.1s ease;z-index:0}
  #ambient.on{opacity:1}
  #ambient svg{position:absolute;inset:0;width:100%;height:100%}
  .mote{animation:moteTw 3.4s ease-in-out infinite alternate}
  .mote:nth-of-type(2){animation-delay:.7s}.mote:nth-of-type(3){animation-delay:1.3s}
  .mote:nth-of-type(4){animation-delay:.2s}.mote:nth-of-type(5){animation-delay:1.7s}
  .mote:nth-of-type(6){animation-delay:.9s}.mote:nth-of-type(7){animation-delay:.4s}
  .mote:nth-of-type(8){animation-delay:1.9s}
  @keyframes moteTw{from{opacity:.08}to{opacity:.85}}
  /* 霓虹戏中字:窗外灯牌,映在档案室墙上(纸面之下) */
  #neon{position:absolute;right:6vw;top:16vh;writing-mode:vertical-rl;pointer-events:none;z-index:0;
    font-size:clamp(20px,3.2vh,34px);letter-spacing:.5em;color:var(--accent-cold);opacity:0;
    text-shadow:0 0 6px #4e7d87,0 0 18px rgba(78,125,135,.8),0 0 42px rgba(78,125,135,.5)}
  #neon.on{animation:neonIn 2.2s ease forwards,flick 7s linear 2.3s infinite}
  @keyframes neonIn{0%{opacity:0}18%{opacity:.95}28%{opacity:.15}44%{opacity:1}100%{opacity:.92}}
  @keyframes flick{0%,91%,95%,100%{opacity:.92}93%{opacity:.45}}

  /* 案卷纸面:全高居中纸卷,正文住在这里 */
  #sheet{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
    width:min(880px,88vw);z-index:1;
    background:linear-gradient(90deg,#d6c7a0 0%,#e7dabd 9%,#e4d7b6 50%,#e0d1ac 91%,#d2c29a 100%);
    box-shadow:0 0 0 1px #b3a179,0 0 60px rgba(0,0,0,.6),inset 0 0 110px rgba(112,92,54,.25)}
  #sheet::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 90% 55% at 50% -6%,rgba(255,240,205,.20),transparent 60%)}
  .sh-tab{position:absolute;left:-31px;top:12vh;writing-mode:vertical-rl;
    background:#2a2317;color:#c9b98c;border:1px solid #6d5d3b;border-left:none;
    padding:16px 7px;font-family:var(--kai);font-size:12px;letter-spacing:.42em;border-radius:0 3px 3px 0;
    box-shadow:2px 4px 10px rgba(0,0,0,.4)}
  /* 环境大字:纸面水印 */
  .bigchar{position:absolute;font-family:var(--kai);font-weight:900;pointer-events:none;
    opacity:0;transition:opacity 4s ease}
  .bigchar.on{opacity:.08}
  .bigchar.c1{font-size:44vh;left:5%;top:8vh;color:#3e3320}

  /* 雨幕:窗玻璃上的雨,落在卷宗之前 */
  #rainfx{position:absolute;inset:0;pointer-events:none;overflow:hidden;display:none;z-index:4}
  #rainfx.on{display:block}
  .drop{position:absolute;top:-46px;width:1.8px;transform:rotate(8deg);
    background:linear-gradient(to bottom,rgba(150,170,190,0),rgba(150,170,190,.9));
    animation:dropFall linear infinite}
  .drop.far{width:1px}
  @keyframes dropFall{
    0%{transform:translate(0,0) rotate(8deg)}
    100%{transform:translate(3vw,116vh) rotate(8deg)}}

  /* 文字流(tape):纸上墨字 */
  #tape{position:absolute;inset:0;pointer-events:none;z-index:2}
  #flow{position:absolute;left:50%;width:min(760px,78vw);
    transform:translate(-50%,0);
    transition:transform .95s cubic-bezier(.22,.8,.24,1),opacity .85s ease}
  /* 正文字号单源：流内所有拍型共享（导语/引语块按倍率放大），改一处全流生效 */
  #flow{--ln-size:clamp(20px,1.2vw + 1.5vh,32px)}
  .ln{font-size:var(--ln-size);line-height:2.05;letter-spacing:.06em;
    color:var(--paper-ink);
    opacity:0;transform:translateY(14px) translateX(var(--dx,0));filter:blur(3px);
    transition:opacity .7s ease,transform .7s ease,filter .7s ease}
  .ln.in{opacity:1;transform:none;filter:none}
  .ln.old1{opacity:.55}.ln.old2{opacity:.3}.ln.old3{opacity:.14}
  /* 回看模式（往回滑动后）：淡化是运镜，回看要可读——历史行恢复浓墨 */
  #tape.back .ln.old1{opacity:.92}
  #tape.back .ln.old2{opacity:.85}
  #tape.back .ln.old3{opacity:.8}
  /* 日期章（@date 章内跳变）：卷宗眉批——细线夹戏中日期，时间一换就钉一针 */
  .ln.dline{display:flex;align-items:center;gap:1em;margin:.4em 0 .2em;
    font-family:var(--kai);font-size:16px;letter-spacing:.34em;color:#8f8567}
  .ln.dline i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#8f856778,transparent)}
  /* 段落导语：每段首拍略放大加重——杂志排版的节奏头（对 --ln-size 取倍率，不受父级字号影响） */
  .ln.lead{font-size:calc(var(--ln-size)*1.08);font-weight:600;letter-spacing:.12em;color:var(--ink-deep)}
  /* 跨拍引语块：纸上引文——楷体 + 朱线，连续拍连成一整段引文栏 */
  .ln.qb{font-family:var(--kai);color:rgba(36,31,20,.92);
    border-left:2px solid rgba(158,58,43,.42);padding-left:.55em}

  /* —— 行内实体签名（ADR-005：全部由 canon 摘要块自动推导，剧本零标注）—— */
  /* 人物：中性墨账本划线——统一签名，绝不携带个体主题色（防别名串联泄底） */
  .ep{font-family:var(--kai);font-weight:700;color:var(--ink-deep);
    background:linear-gradient(transparent 68%,rgba(51,46,33,.17) 0)}
  /* 宇宙级客串（class:universe，永不主角）：金墨骑缝签名——灯箱式闪现入场，
     一闪、一闪、稳亮（向启 E1 尾声「灯箱刚刚亮起」的同构）；仍中性墨不带个体色 */
  .eu{font-family:var(--kai);font-weight:700;color:var(--accent-ink);font-size:.94em;
    letter-spacing:.1em;padding:0 .18em;margin:0 .05em;
    border-block:1px solid rgba(125,98,38,.55);
    text-shadow:0 0 8px rgba(201,161,95,.28);
    animation:euFlick 1.05s ease .18s both}
  @keyframes euFlick{
    0%{opacity:0}22%{opacity:.9}34%{opacity:.14}52%{opacity:1}64%{opacity:.45}100%{opacity:1}}
  /* 地名：行内小印章——朱砂细框，落章式入场 */
  .ex{font-family:var(--kai);font-weight:700;color:var(--blood);font-size:.94em;
    letter-spacing:.08em;padding:0 .2em;margin:0 .05em;
    border:1px solid rgba(158,58,43,.5);border-radius:2px;background:rgba(158,58,43,.05);
    animation:sealInline .42s cubic-bezier(.2,1.5,.4,1) .12s both}
  @keyframes sealInline{from{opacity:0;transform:scale(1.3) rotate(-4deg)}to{opacity:1;transform:none}}
  /* 组织：骑缝方档——上下金线，字距拉开 */
  .eo{font-family:var(--kai);font-weight:600;color:var(--accent-ink);font-size:.94em;
    letter-spacing:.12em;padding:.02em .16em;margin:0 .05em;
    border-block:1px solid rgba(125,98,38,.55)}
  /* 时代词条（ADR-006 图鉴）：淡墨点线——「这是个老词，卷宗里有它的档案」 */
  .et{border-bottom:1px dotted rgba(51,46,33,.45);cursor:help}
  /* 关键信息（日期/时刻/号码）：dateline 数字块——无衬线 + 表格数字，字落后再着墨 */
  .ek{font-family:var(--sans);font-weight:700;color:var(--accent-ink);font-size:.92em;
    letter-spacing:.05em;font-variant-numeric:tabular-nums;
    animation:ekInk .55s ease .22s both}
  @keyframes ekInk{from{opacity:0;filter:blur(1.5px)}to{opacity:1;filter:none}}
  /* 短引语 / 『』嵌套引语 = 朱批关键词：朱砂楷体 + 笔锋下划线渐次拖出 */
  .qk{font-family:var(--kai);font-weight:700;color:var(--blood);letter-spacing:.06em;
    background:linear-gradient(transparent 78%,rgba(158,58,43,.4) 0) no-repeat 0 100%/0 100%;
    animation:qkBrush .7s ease .32s forwards}
  @keyframes qkBrush{to{background-size:100% 100%}}
  /* 单拍内完整长引语：楷体引文（跨拍引语走 .ln.qb 块样式） */
  .lq{font-family:var(--kai);color:rgba(36,31,20,.9)}

  .ln .who{display:inline-block;font-weight:700;margin-right:1.05em;letter-spacing:.14em;font-family:var(--kai);
    border-left:3px solid currentColor;padding-left:.5em}
  .ln.dlg{color:var(--ink-deep)}
  .ln.dlg.lslide{--dx:-16px}
  .ln.choice{display:flex;flex-direction:column;gap:.55em;padding:.5em 0 .2em;pointer-events:auto}
  .opt{display:flex;align-items:baseline;gap:.9em;cursor:pointer;padding:.34em .2em;
    color:var(--paper-ink);opacity:0;transform:translateX(-14px);
    transition:opacity .6s ease,transform .6s ease,color .25s}
  .opt.in{opacity:1;transform:none}
  .opt:hover{color:var(--blood);transform:translateX(6px)}
  .opt .branch{flex:none;width:2.2em;height:1px;align-self:center;
    background:linear-gradient(90deg,transparent,var(--blood));transition:width .25s}
  .opt:hover .branch{width:3.2em}
  /* 转写选错：朱线划掉留在底单上（听岔的痕） */
  .opt.wrong{pointer-events:none}
  .opt.wrong .txt{text-decoration:line-through;text-decoration-color:rgba(158,58,43,.75);
    text-decoration-thickness:2px;opacity:.5}

  /* 角色锚点(分侧):档案室墙上的竖排名条 */
  .anchor{position:absolute;top:50%;transform:translateY(-50%);
    writing-mode:vertical-rl;letter-spacing:.55em;font-size:16px;font-weight:700;
    font-family:var(--kai);
    opacity:0;transition:opacity 1.4s ease;pointer-events:none;z-index:3}
  .anchor.on{opacity:.85}
  .anchor.r{right:2vw}.anchor.l{left:2vw}

  /* 地点印章:盖在卷宗上的朱砂印 */
  .sealwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3vh;pointer-events:none;transition:opacity .8s ease;z-index:5}
  .seal{border:3px double var(--blood);color:var(--blood);border-radius:8px;
    padding:.28em .5em;font-size:clamp(30px,7vh,64px);font-weight:700;font-family:var(--kai);
    letter-spacing:.18em;line-height:1.3;text-align:center;
    transform:rotate(-7deg);opacity:0;
    box-shadow:inset 0 0 0 2px rgba(158,58,43,.25),0 0 22px rgba(158,58,43,.18);
    text-shadow:0 0 10px rgba(158,58,43,.3)}
  .seal.in{animation:sealIn .55s cubic-bezier(.25,1.2,.35,1) forwards}
  @keyframes sealIn{
    0%{opacity:0;transform:rotate(-7deg) scale(2.1)}
    70%{opacity:1;transform:rotate(-7deg) scale(.96)}
    100%{opacity:.95;transform:rotate(-7deg) scale(1)}}
  .seal-cap{font-family:var(--sans);color:#7c704f;font-size:13px;letter-spacing:.35em;
    opacity:0;transition:opacity 1s ease .3s}
  .seal-cap.in{opacity:.9}

  /* 时间轴带:卷宗眉批 */
  #timeline{position:absolute;top:8.5vh;left:50%;transform:translate(-50%,-16px);
    display:flex;align-items:center;gap:14px;opacity:0;
    transition:opacity .9s ease,transform .9s ease;font-family:var(--sans);pointer-events:none;
    padding:6px 20px;z-index:3;
    border-block:1px solid rgba(51,46,33,.18)}
  #timeline.on{opacity:1;transform:translate(-50%,0)}
  .tl-era{font-size:11px;letter-spacing:.2em;color:#8f8567}
  .tl-track{position:relative;width:min(34vw,420px);height:2px;background:rgba(51,46,33,.35);border-radius:2px}
  .tl-dot{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);
    background:rgba(51,46,33,.4);transition:background .8s ease,box-shadow .8s ease}
  .tl-dot.lit{background:var(--blood);box-shadow:0 0 10px rgba(158,58,43,.7)}
  .tl-dot.now{left:100%;background:var(--blood);animation:dotPulse 2s ease-in-out infinite}
  @keyframes dotPulse{50%{box-shadow:0 0 0 6px rgba(158,58,43,.14)}}
  .tl-tag{position:absolute;top:11px;font-size:10px;letter-spacing:.18em;white-space:nowrap;
    transform:translateX(-50%);color:#8f8567;transition:color .8s ease;visibility:hidden}
  .tl-tag.lit{color:var(--blood);visibility:visible}
  .tl-tag.now{left:100%}

  /* 人物声纹卡:别进卷宗的人物档案条 */
  .charcard{position:absolute;top:50%;transform:translateY(-50%) translateX(-26px);opacity:0;
    transition:all .8s cubic-bezier(.2,1,.3,1);
    background:linear-gradient(150deg,#e9dcbd,#dccfa8);border:1px solid #a8946a;border-radius:3px;
    box-shadow:0 14px 40px rgba(10,7,3,.55),inset 0 0 0 4px rgba(23,19,13,.10);
    padding:1.4em 1.6em;max-width:300px;pointer-events:none;z-index:5}
  .charcard::before,.charcard::after{content:"";position:absolute;width:26px;height:26px;pointer-events:none}
  .charcard::before{top:9px;left:9px;border-top:2px solid #b09657;border-left:2px solid #b09657}
  .charcard::after{right:9px;bottom:9px;border-right:2px solid #b09657;border-bottom:2px solid #b09657}
  .charcard.on{opacity:1;transform:translateY(-50%)}
  .charcard.l{left:3vw}
  .charcard.r{right:3vw;transform:translateY(-50%) translateX(26px)}
  .charcard.r.on{transform:translateY(-50%)}
  .cc-kicker{font-family:var(--sans);font-size:10px;color:#8f8567;letter-spacing:.34em;margin-bottom:.55em}
  .cc-name{font-size:28px;letter-spacing:.28em;font-weight:700;font-family:var(--kai);color:var(--ink-deep)}
  .cc-wave{display:block;margin:.85em 0 .55em;width:180px;height:36px}
  .cc-wave path{fill:none;stroke-width:1.6;stroke-linecap:round}
  .cc-bio{font-family:var(--sans);font-size:11px;color:#6e6549;letter-spacing:.12em;line-height:1.95}

  /* 章节题签:夹进卷宗的书签纸条 */
  .chcard{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2.6em;
    pointer-events:none;opacity:0;transition:opacity 1.1s ease;z-index:5}
  .chcard .ch-num{writing-mode:vertical-rl;font-family:var(--kai);font-weight:700;
    font-size:clamp(30px,5.4vh,52px);letter-spacing:.5em;color:var(--paper-ink)}
  .chcard .ch-bar{width:1px;height:24vh;background:linear-gradient(rgba(158,58,43,0),rgba(158,58,43,.6),rgba(158,58,43,0))}
  .chcard .ch-title{writing-mode:vertical-rl;font-family:var(--kai);
    font-size:clamp(16px,2.6vh,24px);letter-spacing:.55em;color:#6e6549}
  .chcard .ch-date{writing-mode:vertical-rl;font-family:var(--kai);
    font-size:12px;letter-spacing:.4em;color:#8f8567;opacity:.9}
  .chcard .ch-seal{display:flex;align-items:center;justify-content:center;
    width:44px;height:58px;border:2px solid var(--blood);color:var(--blood);
    font-family:var(--kai);font-size:26px;transform:rotate(-6deg);opacity:.8;
    box-shadow:inset 0 0 0 1px rgba(158,58,43,.3)}

  /* HUD / 标题 / 存档 / 结局 */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(2.2vh + env(safe-area-inset-top,0px)) calc(2.4vw + env(safe-area-inset-right,0px)) 2.2vh calc(2.4vw + env(safe-area-inset-left,0px));
    pointer-events:none;font-family:var(--sans);z-index:6}
  #hudL .uni{font-size:11px;letter-spacing:.32em;color:#a2956f}
  #hudL .dt{font-size:11px;letter-spacing:.3em;color:#c9a15f;margin-top:.45em;font-family:var(--kai);
    opacity:0;transition:opacity 1.2s}
  #hudL .dt.on{opacity:.92}
  #hudL .ch{font-size:13px;letter-spacing:.22em;color:var(--ink-dim);margin-top:.4em;opacity:0;transition:opacity 1.2s}
  #hudL .ch.on{opacity:1}
  #hudR{display:flex;flex-direction:column;align-items:flex-end;gap:.55em}
  .bag{display:flex;align-items:center;gap:.6em;font-size:11px;color:#8f8567;letter-spacing:.22em;min-height:22px}
  .chips{display:flex;gap:.5em;flex-wrap:wrap;justify-content:flex-end;max-width:38vw}
  /* 线索 = 证物标签:纸签加红线孔 */
  .chip{position:relative;display:inline-flex;align-items:center;
    background:var(--paper);color:var(--paper-ink);border:1px solid #a8946a;border-radius:2px;
    padding:.28em .85em .28em 1.6em;font-size:11px;letter-spacing:.14em;
    transform:scale(0);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
  .chip::before{content:"";position:absolute;left:.55em;width:5px;height:5px;border-radius:50%;
    background:var(--blood);box-shadow:0 0 0 1px rgba(158,58,43,.35)}
  .chip.in{transform:scale(1)}
  .topbtns{display:flex;gap:8px}
  #stage button{pointer-events:auto;background:#241e14;color:var(--ink);
    border:1px solid #6d5d3b;border-radius:3px;padding:4px 12px;cursor:pointer;
    font-size:12px;font-family:var(--kai);letter-spacing:.16em;
    transition:transform .2s,border-color .2s,color .2s,box-shadow .2s}
  #stage button:hover{border-color:var(--accent);color:#f0e6cd;transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(0,0,0,.5)}

  #hint{position:absolute;bottom:calc(3.4vh + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
    font-family:var(--sans);font-size:13px;letter-spacing:.34em;color:#8f8567;
    opacity:0;transition:opacity .6s;z-index:6;pointer-events:none}
  #hint.on{opacity:.9}
  /* 版本指纹（footer 左下角）：部署追踪——v版本 · sha · 起服 · 服务器时间 */
  #vtag{position:absolute;left:10px;bottom:calc(5px + env(safe-area-inset-bottom,0px));
    max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--sans);font-size:10px;letter-spacing:.06em;color:#8f8567;opacity:.62;
    font-variant-numeric:tabular-nums;pointer-events:none;z-index:41;
    text-shadow:0 0 3px rgba(23,19,13,.45)}

  /* 标题页:卷宗封面 */
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 38%,#241d12 0%,#17130d 70%);z-index:20}
  .t-paper{position:relative;display:flex;flex-direction:column;align-items:center;
    width:min(640px,92vw);padding:5.5vh 5vw 4.5vh;gap:2.4vh;
    background:linear-gradient(150deg,#e9dcbd,#ddd0a9);
    box-shadow:0 30px 90px rgba(0,0,0,.7),inset 0 0 0 4px rgba(23,19,13,.10),inset 0 0 0 5px rgba(168,148,106,.5)}
  .t-paper::before,.t-paper::after{content:"";position:absolute;width:34px;height:34px;pointer-events:none}
  .t-paper::before{top:11px;left:11px;border-top:2px solid #b09657;border-left:2px solid #b09657}
  .t-paper::after{right:11px;bottom:11px;border-right:2px solid #b09657;border-bottom:2px solid #b09657}
  .t-seal{position:absolute;top:24px;right:26px;display:flex;align-items:center;justify-content:center;
    width:50px;height:66px;color:var(--blood);border:2px solid var(--blood);border-radius:3px;
    box-shadow:inset 0 0 0 1px rgba(158,58,43,.35);
    font-family:var(--kai);font-size:32px;transform:rotate(-5deg);opacity:.85}
  .t-kicker{font-family:var(--kai);color:#7c704f;font-size:13px;letter-spacing:.5em}
  #title h1{font-size:clamp(30px,6vh,56px);letter-spacing:.32em;text-indent:.32em;
    font-family:var(--kai);color:#2e2818;font-weight:700}
  .t-rule{display:flex;align-items:center;gap:12px;width:64%;color:var(--blood)}
  .t-rule i{flex:1;height:1px;background:#9b8a65}
  .t-rule span{display:flex;align-items:center;justify-content:center;
    width:24px;height:24px;border:1px solid var(--blood);border-radius:2px;
    font-family:var(--kai);font-size:15px;transform:rotate(-4deg)}
  #gameList{display:flex;flex-direction:column;gap:12px;margin-top:1vh;width:100%}
  #gameList button{background:rgba(255,252,242,.4);border:1px solid #b3a179;border-left:3px solid var(--blood);
    border-radius:2px;color:#2e2818;padding:.8em 3em;font-size:clamp(14px,2.2vh,21px);cursor:pointer;
    letter-spacing:.14em;font-family:var(--kai);
    transition:transform .2s,background .2s,box-shadow .2s}
  #gameList button:hover{background:#f2e8cc;transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,15,8,.25);color:#2e2818}
  #gameList .g-sub{display:block;font-family:var(--sans);font-size:.55em;color:#7c704f;margin-top:.4em;letter-spacing:.2em}
  #gameList .g-hook{display:block;font-family:var(--kai);font-size:.58em;color:#5d543e;margin-top:.55em;letter-spacing:.12em}
  .t-foot{font-family:var(--sans);color:#857a5b;font-size:11px;letter-spacing:.3em}

  /* 侧面板统一交互（关闭钮/互斥/点外关闭见 player.mjs）：标题行 flex 让出关闭钮 */
  .sidepanel h3{display:flex;align-items:center;justify-content:space-between;gap:8px}
  /* 舞台 touch-action:none 让位给拖拽回看；面板与纸卡内部恢复原生滚动 */
  .sidepanel,.ec-paper,.ap-paper{touch-action:pan-y}
  #stage button.armed{border-color:var(--blood);color:#e8b8ae;background:#5a221a;letter-spacing:.1em}
  .pnl-x{flex:none;background:transparent;border:1px solid #9b8a65;border-radius:2px;color:#655c48;
    font:16px/1 var(--sans);padding:6px 12px;min-height:34px;min-width:34px;cursor:pointer;letter-spacing:0}
  .pnl-x:hover{border-color:var(--blood);color:var(--blood)}

  /* 底单回看:抽屉里的转写纸带 */
  #sheetPanel{position:absolute;right:2%;top:10%;width:min(400px,92vw);max-height:70%;overflow:auto;display:none;
    background:linear-gradient(150deg,#e9dcbd,#ddd0a9);border:1px solid #a8946a;border-radius:3px;padding:14px;z-index:21;
    font-family:var(--sans);color:#2e2818;
    box-shadow:0 24px 70px rgba(0,0,0,.7),inset 0 0 0 4px rgba(23,19,13,.10)}
  #sheetPanel.on{display:block}
  #sheetPanel h3{font-size:13px;color:#7c704f;margin-bottom:8px;letter-spacing:.28em;font-family:var(--kai)}
  .tr-row{display:flex;gap:10px;padding:7px 4px;border-bottom:1px dashed rgba(124,112,79,.35);font-size:13px;align-items:baseline}
  .tr-row-caller{flex:none;color:#9e3a2b;font-family:var(--kai);letter-spacing:.1em}
  .tr-row-text{color:#2e2818}
  /* 同频分组：底单回看按声纹聚簇——同形波相邻并列，形状即线索（不标数字，保播种公平） */
  .tr-row .tr-wave{width:76px;height:18px;vertical-align:-4px}
  .tr-sep{border:none;border-top:2px dashed rgba(158,58,43,.4);margin:4px 0}
  .tr-note{font-size:11px;color:#8f8567;letter-spacing:.18em;margin:6px 0 2px;font-family:var(--kai)}
  .tr-rule{font-size:11px;color:rgba(110,101,73,.9);letter-spacing:.1em}

  /* 存档:档案室抽屉里的纸片 */
  #savesPanel{position:absolute;right:2%;top:10%;width:min(360px,92vw);max-height:70%;overflow:auto;display:none;
    background:linear-gradient(150deg,#e9dcbd,#ddd0a9);border:1px solid #a8946a;border-radius:3px;padding:14px;z-index:21;
    font-family:var(--sans);color:#2e2818;
    box-shadow:0 24px 70px rgba(0,0,0,.7),inset 0 0 0 4px rgba(23,19,13,.10)}
  #savesPanel.on{display:block}
  #savesPanel h3{font-size:13px;color:#7c704f;margin-bottom:8px;letter-spacing:.28em;font-family:var(--kai)}
  .save{padding:8px;border-radius:2px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px;
    border-bottom:1px dashed rgba(124,112,79,.4)}
  .save:hover{background:rgba(124,112,79,.12)}

  /* 图鉴:时代词条与人物档案的收集页（已入档可读，未入档悬影，案卷字段逐条解锁） */
  #codexPanel{position:absolute;right:2%;top:10%;width:min(460px,92vw);max-height:74%;overflow:auto;display:none;
    background:linear-gradient(150deg,#e9dcbd,#ddd0a9);border:1px solid #a8946a;border-radius:3px;padding:14px;z-index:21;
    font-family:var(--sans);color:#2e2818;
    box-shadow:0 24px 70px rgba(0,0,0,.7),inset 0 0 0 4px rgba(23,19,13,.10)}
  #codexPanel.on{display:block}
  #codexPanel h3{font-size:13px;color:#7c704f;margin:0 0 8px;letter-spacing:.28em;font-family:var(--kai)}
  .cx-sec{font-size:11px;color:#9e3a2b;letter-spacing:.3em;margin:10px 0 4px;font-family:var(--kai);
    border-bottom:1px solid rgba(158,58,43,.3);padding-bottom:3px}
  .cx-item{border-bottom:1px dashed rgba(124,112,79,.35);padding:8px 2px}
  .cx-name{font-family:var(--kai);font-size:16px;letter-spacing:.2em;font-weight:700;color:#2e2818}
  .cx-item.ghost .cx-name{color:#8f8567;letter-spacing:.5em}
  .cx-kicker{font-size:11px;color:#8f8567;letter-spacing:.18em;margin-top:2px}
  .cx-body{font-family:var(--serif);font-size:13px;line-height:1.9;color:#332e21;margin-top:5px}
  .cx-field{display:flex;gap:8px;font-size:12.5px;margin-top:5px;align-items:baseline}
  .cx-field b{flex:none;font-family:var(--kai);color:#7c704f;font-weight:600}
  .cx-field span{color:#332e21}
  .cx-field.locked span{color:#a8946a;letter-spacing:.3em}
  .cx-kind{display:inline-block;font-size:10px;color:#8f8567;border:1px solid #a8946a;border-radius:2px;
    padding:0 .4em;margin-left:.5em;letter-spacing:.15em;vertical-align:2px}

  /* 结局档案:已归档可回读全文,未归档只给暗示（收集引导，不泄内容） */
  #endsPanel{position:absolute;right:2%;top:10%;width:min(460px,92vw);max-height:74%;overflow:auto;display:none;
    background:linear-gradient(150deg,#e9dcbd,#ddd0a9);border:1px solid #a8946a;border-radius:3px;padding:14px;z-index:21;
    font-family:var(--sans);color:#2e2818;
    box-shadow:0 24px 70px rgba(0,0,0,.7),inset 0 0 0 4px rgba(23,19,13,.10)}
  #endsPanel.on{display:block}
  #endsPanel h3{font-size:13px;color:#7c704f;margin-bottom:10px;letter-spacing:.28em;font-family:var(--kai)}
  .end-item{border-bottom:1px dashed rgba(124,112,79,.4);padding:10px 2px}
  .end-title{font-family:var(--kai);font-size:16px;letter-spacing:.22em;color:#2e2818;font-weight:700}
  .end-item.locked .end-title{color:#8f8567}
  .end-hint{font-family:var(--kai);font-size:13px;color:#9e3a2b;letter-spacing:.08em;margin-top:6px}
  .end-body{margin-top:8px;font-family:var(--serif);font-size:13px;line-height:1.95;color:#332e21}
  .end-body p{margin:.1em 0}
  .end-body i{font-style:normal;font-family:var(--kai);font-weight:700;margin-right:.6em}
  .end-body .end-tr{color:#7c2f24;background:rgba(158,58,43,.06);padding:.15em .5em;margin:.2em 0}

  /* 结局:朱批结案 */
  #endcard{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(12,9,5,.84);opacity:0;pointer-events:none;transition:opacity 1.5s;z-index:22}
  #endcard.on{opacity:1;pointer-events:auto}
  .ec-paper{position:relative;display:flex;flex-direction:column;align-items:center;
    width:min(560px,92vw);max-height:86vh;overflow:auto;padding:4.5vh 6vw;gap:2vh;
    background:linear-gradient(150deg,#e9dcbd,#ddd0a9);
    box-shadow:0 30px 90px rgba(0,0,0,.7),inset 0 0 0 4px rgba(23,19,13,.10),inset 0 0 0 5px rgba(168,148,106,.5)}
  .ec-paper::before,.ec-paper::after{content:"";position:absolute;width:30px;height:30px;pointer-events:none}
  .ec-paper::before{top:10px;left:10px;border-top:2px solid #b09657;border-left:2px solid #b09657}
  .ec-paper::after{right:10px;bottom:10px;border-right:2px solid #b09657;border-bottom:2px solid #b09657}
  .ec-seal{display:flex;align-items:center;justify-content:center;
    width:54px;height:68px;border:3px double var(--blood);color:var(--blood);border-radius:6px;
    font-family:var(--kai);font-size:34px;transform:rotate(-7deg);opacity:.85;
    box-shadow:inset 0 0 0 2px rgba(158,58,43,.25)}
  .ec-label{color:var(--blood);letter-spacing:.5em;font-size:clamp(11px,1.6vh,16px);font-family:var(--kai)}
  #endTitle{font-size:clamp(26px,5vh,46px);letter-spacing:.22em;font-family:var(--kai);color:#2e2818;font-weight:700}
  #endCollected{color:#7c704f;font-size:clamp(11px,1.6vh,14px);line-height:1.9;font-family:var(--sans);text-align:center}
  .ec-btns{display:flex;gap:1.4em;margin-top:1vh}
  #endcard.settle .ec-btns button{pointer-events:none}
  #endcard.settle::after{content:"…";position:absolute;bottom:6vh;left:50%;transform:translateX(-50%);
    color:var(--ink-dim);font-size:14px;letter-spacing:.5em;opacity:.6}
  .ec-btns button{background:#7c2f24;border-color:#a85c45;color:#f0dfb8;padding:.55em 1.8em;font-size:14px}
  .ec-btns button:hover{background:#87392c;border-color:#d49a6d;color:#f6e8c4}
  .ec-btns #btnBackTitle{background:transparent;border-color:#8d8063;color:#655c48}
  .ec-btns #btnBackTitle:hover{color:#2e2a20;background:#d9cba4}

  /* 账籍:封面下缘的身份批注（游客可玩，注册留存进度） */
  .t-auth{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:1vh;
    font-family:var(--sans);font-size:12px;color:#857a5b;letter-spacing:.14em}
  .t-auth button{background:transparent;border:1px solid #9b8a65;border-radius:2px;color:#655c48;
    padding:.35em 1em;font-size:12px;font-family:var(--kai);letter-spacing:.2em;cursor:pointer;
    transition:color .2s,border-color .2s}
  .t-auth button:hover{border-color:var(--blood);color:var(--blood)}
  #authPanel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(12,9,5,.84);opacity:0;pointer-events:none;transition:opacity .5s;z-index:23}
  #authPanel.on{opacity:1;pointer-events:auto}
  .ap-paper{position:relative;display:flex;flex-direction:column;align-items:center;
    width:min(380px,92vw);padding:4vh 7vw 3.5vh;gap:1.6vh;
    background:linear-gradient(150deg,#e9dcbd,#ddd0a9);
    box-shadow:0 30px 90px rgba(0,0,0,.7),inset 0 0 0 4px rgba(23,19,13,.10),inset 0 0 0 5px rgba(168,148,106,.5)}
  .ap-seal{display:flex;align-items:center;justify-content:center;width:44px;height:58px;
    color:var(--blood);border:2px solid var(--blood);border-radius:3px;
    font-family:var(--kai);font-size:28px;transform:rotate(-6deg);opacity:.85;
    box-shadow:inset 0 0 0 1px rgba(158,58,43,.3)}
  .ap-kicker{font-family:var(--kai);color:#7c704f;font-size:14px;letter-spacing:.32em}
  .ap-in{width:100%;padding:.6em .8em;background:rgba(255,252,242,.5);border:1px solid #8b7f5e;
    border-radius:2px;font:inherit;font-size:15px;color:#332e21;outline:none}
  .ap-in:focus{border-color:var(--accent-cold)}
  .ap-err{min-height:1.5em;font-size:12px;color:var(--blood);font-family:var(--sans);text-align:center}
  .ap-btns{display:flex;gap:1em}
  .ap-switch{font-size:12px;color:#7c704f;cursor:pointer;font-family:var(--sans);
    text-decoration:underline dotted;text-underline-offset:4px}
  .ap-switch:hover{color:var(--blood)}

  /* 可安装应用：封面只放一枚安静入口，原生提示不可用时给出主屏幕步骤 */
  .t-install{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:.4vh;
    font-family:var(--sans);font-size:11px;color:#857a5b;letter-spacing:.1em}
  #title .t-install button{background:transparent;border-color:#9b8a65;color:#655c48;
    padding:.35em 1em;font-size:12px;letter-spacing:.16em;box-shadow:none}
  #title .t-install button:hover{border-color:var(--blood);color:var(--blood);transform:none}
  #title .t-install button:disabled{opacity:.65;cursor:default;border-color:#a8946a;color:#7c704f}
  #installHelp{width:min(430px,92vw);max-height:88vh;margin:auto;padding:0;border:1px solid #a8946a;border-radius:3px;
    background:linear-gradient(150deg,#e9dcbd,#ddd0a9);color:#332e21;
    box-shadow:0 30px 90px rgba(0,0,0,.7),inset 0 0 0 4px rgba(23,19,13,.10)}
  #installHelp::backdrop{background:rgba(12,9,5,.84)}
  .install-paper{display:flex;flex-direction:column;align-items:center;padding:30px 34px 26px;text-align:center}
  .install-paper h2{margin:14px 0 16px;font:700 25px var(--kai);letter-spacing:.12em;color:#2e2818}
  #installSteps{margin:0 0 16px;padding-left:1.5em;text-align:left;font:14px/2 var(--sans);color:#5d543e}
  .install-note{font:11px/1.8 var(--sans);color:#857a5b;letter-spacing:.06em}
  #installClose{margin-top:20px;padding:8px 24px;border:1px solid #7d6226;border-radius:2px;
    background:#241e14;color:#e6dabb;font:14px var(--kai);letter-spacing:.16em;cursor:pointer}

  #toast{position:absolute;top:9%;left:50%;transform:translateX(-50%);
    background:#e9dcbd;border:1px solid #a8946a;border-left:3px solid var(--blood);border-radius:2px;
    padding:6px 18px;font-size:13px;font-family:var(--sans);color:#2e2818;
    box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .3s;
    pointer-events:none;z-index:40}
  #toast.on{opacity:1}

  @media (prefers-reduced-motion:reduce){
    .drop,.mote,#stage.shake{animation:none!important}
    /* 实体签名动效全关；文字流只留淡入，不模糊不位移 */
    .ex,.eo,.ek,.qk,.eu{animation:none!important}
    .qk{background-size:100% 100%}
    .ln{filter:none!important;transform:none!important;transition:opacity .3s ease!important}
    /* 峰值拍退化为快速淡入（保留信息，去掉长动效） */
    .desk-row,.coll-wave,.rt-key,.who.split,.rt-key.cut::after{transition-duration:.25s!important;animation-duration:.25s!important}
  }

/* 转写拍（g01 原语·选择题）:呼机留言纸带——呼入者报话，玩家选出该入机的那条 */
.tr{display:flex;flex-direction:column;gap:8px;padding:14px 18px;max-width:640px;margin:6px auto 0;
    border:1px solid #a8946a;border-radius:2px;background:rgba(255,252,242,.5);
    position:relative}
.tr::before{content:"";position:absolute;left:8px;right:8px;top:4px;border-top:1px dashed rgba(124,112,79,.5)}
.tr-caller{font-size:14px;color:var(--blood,#9e3a2b);letter-spacing:2px;font-family:var(--kai)}
  /* 呼入者迷你声纹：中性墨小波形——形状即线索，不标数字（播种层公平证据） */
  .tr-wave{display:inline-block;vertical-align:-4px;width:64px;height:16px;margin-left:.55em;opacity:.9}
  .tr-wave path{fill:none;stroke:rgba(51,46,33,.6);stroke-width:1.3;stroke-linecap:round}
  .tr-row .tr-wave{width:56px;height:14px;vertical-align:-3px}
.tr-rule{font-size:13px;color:rgba(110,101,73,.9);letter-spacing:.1em}
.tr-done{font-size:16px;color:rgba(46,40,24,.9);padding:10px 4px;letter-spacing:1px}

  /* —— 峰值拍（@peak，舞台合同 v1 首片）——回报拍专用，播种拍保持安静 —— */
  /* 死单拍：氛围压暗（#ambient 已有 filter 过渡）+ 回执朱砂化 + 戏中时间戳 */
  #ambient.dim{filter:brightness(.55) saturate(.72)}
  .tr-done.dead{color:var(--blood)}
  .tr-stamp{display:inline-block;margin-left:.9em;padding:.06em .4em;border:1px solid var(--blood);
    border-radius:2px;color:var(--blood);font-size:.82em;letter-spacing:.14em;transform:rotate(-3deg)}
  /* 内声拍：全游戏唯一带声音的叙述行——浓墨底带 + 慢入场（首拍携带玩家声纹波） */
  .ln.inner{background:rgba(36,31,20,.055);border-block:1px solid rgba(51,46,33,.25);
    padding:.12em .45em;margin:.14em 0;
    transition:opacity 1.1s ease,transform 1.1s ease,filter 1.1s ease}
  .inner-wave{margin-right:.55em;opacity:.95}
  .inner-wave path{stroke:rgba(51,46,33,.8)}
  /* 分身拍（你→她）：首拍签条中性墨起笔、个体色慢渗入——代词分裂在排版层可见 */
  .who.split{color:var(--paper-ink);animation:colorBleed 1.8s ease .5s forwards}
  @keyframes colorBleed{to{color:var(--c)}}
  /* 证物拍：并排成案的底单（Hz 数字只在回报拍出现——播种拍只给形状） */
  .desk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
    width:min(640px,90vw);padding:2em 2.4em;pointer-events:none;
    background:linear-gradient(150deg,#e9dcbd,#dccfa8);border:1px solid #a8946a;border-radius:3px;
    box-shadow:0 24px 70px rgba(0,0,0,.7),inset 0 0 0 4px rgba(23,19,13,.10);
    opacity:1;transition:opacity .7s ease;font-family:var(--sans)}
  .desk-kicker{font-size:11px;letter-spacing:.34em;color:#8f8567;margin-bottom:1em;font-family:var(--kai)}
  .desk-row{display:flex;align-items:center;gap:1em;padding:.5em 0;border-bottom:1px dashed rgba(124,112,79,.35);
    opacity:0;transform:translateX(-18px);transition:all .6s ease;font-size:14px}
  .desk-row.in{opacity:1;transform:none}
  .desk-caller{flex:none;width:5.5em;color:var(--blood);font-family:var(--kai);letter-spacing:.08em}
  .desk-wave{width:72px;height:16px;flex:none}
  .desk-wave path{fill:none;stroke:rgba(51,46,33,.6);stroke-width:1.3;stroke-linecap:round;transition:stroke .5s ease}
  .desk-wave.same path{stroke:var(--blood);stroke-width:1.8}
  .desk-wave.same{filter:drop-shadow(0 0 3px rgba(158,58,43,.4))}
  .desk-hz{flex:none;font-size:12px;color:var(--accent-ink);font-variant-numeric:tabular-nums;letter-spacing:.05em}
  .desk-hz i{font-style:normal;font-size:10px;margin-left:2px;color:#8f8567}
  .desk-text{color:#2e2818;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 并轨拍：四条呼入波形从四角滑入、叠合成一根 */
  .coll{position:absolute;inset:0;z-index:5;pointer-events:none;transition:opacity .6s ease}
  .coll-wave{position:absolute;left:50%;top:50%;width:300px;height:60px;
    transform:translate(-50%,-50%);opacity:0;transition:all .95s cubic-bezier(.3,.9,.25,1)}
  .coll-wave path{fill:none;stroke:rgba(230,218,187,.85);stroke-width:1.5;stroke-linecap:round}
  .coll-wave.p0{transform:translate(calc(-50% - 26vw),calc(-50% - 18vh))}
  .coll-wave.p1{transform:translate(calc(-50% + 26vw),calc(-50% - 16vh))}
  .coll-wave.p2{transform:translate(calc(-50% - 24vw),calc(-50% + 17vh))}
  .coll-wave.p3{transform:translate(calc(-50% + 25vw),calc(-50% + 18vh))}
  .coll.merge .coll-wave{opacity:.8;transform:translate(-50%,-50%)}
  .coll.merged .coll-wave:not(.one){opacity:0}
  .coll .coll-wave.one{transition-delay:.25s}
  .coll.merged .coll-wave.one{opacity:1}
  /* 复键拍：键出 → 朱线划除 → 重打 */
  .rt{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;
    display:flex;align-items:center;gap:.6em;transition:opacity .5s ease}
  .rt-key{position:relative;font-family:var(--kai);font-size:clamp(30px,6vh,54px);letter-spacing:.18em;
    color:var(--paper-ink);opacity:0;transition:opacity .35s ease}
  .rt-key.in{opacity:1}
  .rt-key.cut{opacity:.45}
  .rt-key.cut::after{content:"";position:absolute;left:-6%;right:-6%;top:52%;height:2px;background:var(--blood);
    transform:scaleX(0);transform-origin:left center;animation:cutWipe .38s ease forwards}
  @keyframes cutWipe{to{transform:scaleX(1)}}
  .rt-key.b{color:var(--ink-deep)}

  /* 响应式:中屏收边饰,窄屏保正文 */
  @media (max-width:900px){
    #sheet{width:94vw}
    #flow{width:min(760px,84vw)}
    .anchor{display:none}
    #neon{display:none}
    .charcard{max-width:262px}
    .cc-wave{width:150px}
  }
  @media (max-width:520px){
    #hud button{font-size:11px;padding:5px 9px;letter-spacing:1px;min-height:34px}
    #hud{gap:6px}
    .sh-tab{display:none}
    .t-seal{top:14px;right:14px;width:38px;height:52px;font-size:24px}
    .tl-track{width:30vw}
    #toast{font-size:12px}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="ambient"></div>
  <div id="neon"></div>

  <div id="sheet">
    <div class="sh-tab">案卷</div>
    <div class="ppgrain"></div>
    <div class="bigchar c1" id="bc1"></div>
  </div>

  <div id="tape"><div id="flow"></div></div>
  <div id="anchors"></div>
  <div id="rainfx"></div>

  <div id="hud">
    <div id="hudL">
      <div class="uni" id="worldLabel"></div>
      <div class="dt" id="dateLabel"></div>
      <div class="ch" id="chapterLabel"></div>
    </div>
    <div id="hudR">
      <div class="bag"><span>证物</span><span class="chips" id="clues"></span></div>
      <div class="topbtns">
        <button id="btnSheet">底单</button>
        <button id="btnEnds">结案</button>
        <button id="btnCodex">图鉴</button>
        <button id="btnSaves">存档</button>
        <button id="btnRestart">重新开始</button>
        <button id="btnMute">♪ 音效</button>
        <button id="btnTitle">标题</button>
      </div>
    </div>
  </div>

  <div id="timeline"></div>
  <div id="hint">点击 · 空格 —— 继续 ▸</div>

  <div id="title">
    <div class="t-paper">
      <div class="ppgrain"></div>
      <div class="t-seal">锦</div>
      <div class="t-kicker">锦江悬疑宇宙 · 文字舞台</div>
      <h1>档 案 库</h1>
      <div class="t-rule"><i></i><span>卷</span><i></i></div>
      <div id="gameList"></div>
      <div class="t-auth" id="authBar"></div>
      <div class="t-install">
        <button id="btnInstall" type="button" aria-haspopup="dialog">安装到手机</button>
        <span id="installNote">存入主屏幕 · 随时开卷</span>
      </div>
      <div class="t-foot">灯下摊开的卷宗 · 点击与空格推进</div>
    </div>
  </div>

  <div id="savesPanel" class="sidepanel"><h3>读取存档<button class="pnl-x" aria-label="关闭">×</button></h3><div id="savesList"></div></div>
  <div id="endsPanel" class="sidepanel"><h3>结案档案 · 已归档结局<button class="pnl-x" aria-label="关闭">×</button></h3><div id="endsList"></div></div>
  <div id="codexPanel" class="sidepanel"><h3>卷宗图鉴 · 时代与人物<button class="pnl-x" aria-label="关闭">×</button></h3><div id="codexList"></div></div>
  <div id="sheetPanel" class="sidepanel"><h3>转写底单 · 本局<button class="pnl-x" aria-label="关闭">×</button></h3><div id="sheetList"></div></div>

  <div id="endcard">
    <div class="ec-paper">
      <div class="ppgrain"></div>
      <div class="ec-seal">结</div>
      <div class="ec-label">— 案卷终页 —</div>
      <div id="endTitle"></div>
      <div id="endCollected"></div>
      <div class="ec-btns">
        <button id="btnAgain">翻页重开</button>
        <button id="btnEnds2">结案档案</button>
        <button id="btnBackTitle">回到封面</button>
      </div>
    </div>
  </div>

  <div id="authPanel">
    <div class="ap-paper">
      <div class="ppgrain"></div>
      <div class="ap-seal">籍</div>
      <div class="ap-kicker" id="apTitle">注册 · 留存进度</div>
      <input id="apUser" class="ap-in" placeholder="用户名（2-24 字）" autocomplete="username" maxlength="24">
      <input id="apPass" class="ap-in" type="password" placeholder="密码（至少 8 位）" autocomplete="current-password">
      <div class="ap-err" id="apErr"></div>
      <div class="ap-btns">
        <button id="apSubmit">立档</button>
        <button id="apClose">取消</button>
      </div>
      <div class="ap-switch" id="apSwitch">已有档案？直接登录</div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="vtag" aria-hidden="true"></div>
</div>
<dialog id="installHelp" aria-labelledby="installTitle">
  <div class="install-paper">
    <div class="ap-seal">锦</div>
    <h2 id="installTitle">把卷宗放进手机</h2>
    <ol id="installSteps"></ol>
    <p class="install-note">安装只添加入口；剧情与存档仍安全保存在服务器。</p>
    <button id="installClose" type="button">知道了</button>
  </div>
</dialog>
<script type="module" src="/player.mjs"></script>
<script type="module" src="/pwa.mjs"></script>
</body>
</html>
