# 发布门禁与发布流水线：release → PR(main) 与 main 的直接推送。
# 门禁与 feat-pr-dev-release 相同，外加：
#   - PR 路径：Docker 镜像构建冒烟（不消费任何 secrets）；
#   - push:main / 手动路径：镜像推阿里云 ACR（xiaowenz/novel-universe，与 app41 同实例）
#     → 受限 SSH 密钥部署 gb-test 测试机（密钥在服务器侧强制命令锁定为
#     /opt/apps/novel-universe/deploy.sh，只能触发 pull→up→冒烟；
#     主机指纹以 DEPLOY_KNOWN_HOSTS 钉死防 MITM）。
#     pull 重试与冒烟轮询逻辑在服务器脚本里，输出随 SSH 流回本 workflow。
#     服务器脚本版本化副本：docker/deploy-remote.sh——改动两处同步。
# secrets 为仓库级（与 the-41-days 同名同值，唯 DEPLOY_KEY 是本仓库专用新钥）：
# 见 docker/服务器初始化.md 的「必须提供」清单。
# 部署目标：gb-test 127.0.0.1:18084（chengdu.xiaowenz.com 由 CF 侧指向，仓库不管域名）。
name: pr-main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 单测 + 编译 + lint + API + e2e 全量
        run: npm test
      - name: 剧透纪元 + 图 + 结局全可达
        run: npm run verify
      - name: 迁移落地并幂等
        run: |
          npm run migrate
          npm run migrate:status

  docker:
    runs-on: ubuntu-latest
    needs: gates
    timeout-minutes: 30   # 跨境推 ACR 偶发滞涨：与 app41 同预算，留足重试余量
    steps:
      - uses: actions/checkout@v4

      # PR 只做构建冒烟：本地 tag，不登录、不推送、不消费 secrets
      - name: 镜像构建冒烟（启动即迁移+编译，构建通过即部署入口可用）
        if: github.event_name == 'pull_request'
        run: docker build -t novel-universe:ci .

      # main 推送 / 手动触发：推 ACR（sha 可回溯 + main 浮动标签）
      - name: 登录 ACR(重试抗瞬断，五次皆败必须红在本步)
        if: github.event_name != 'pull_request'
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            if echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin; then ok=1; break; fi
            echo "login 失败,第 $i 次重试"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "ACR 登录五次均失败（检查 ACR_REGISTRY/ACR_USERNAME/ACR_PASSWORD）"; exit 1; }

      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'

      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/xiaowenz/novel-universe:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/xiaowenz/novel-universe:main
          cache-from: type=gha
          cache-to: type=gha,mode=min
          # 阿里云 ACR 个人版不认 buildx 默认的 provenance 认证清单（vnd.oci.empty）——关掉
          provenance: false

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'
    # 部署不可并发：排队不取消，避免两轮 pull/up 互相踩（仅约束本 job，不影响 PR 门禁）
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: 部署到测试机并冒烟（受限密钥 → 服务器 deploy.sh）
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_* secrets 未配置——镜像已推 ACR，跳过部署（见 docker/服务器初始化.md）"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # 密钥在服务器侧被强制命令接管：不带远程命令，连上即执行部署脚本；退出码即部署成败
          ssh -F /dev/null -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST"
